<style>
:root{--bg:#0a1628;--bg2:#0f1f3d;--card:#132040;--card2:#1a2a52;--border:#1e3460;--blue:#3B8AC7;--bluel:#5ba3d8;--yellow:#FDB913;--green:#5A9F3E;--red:#E74C3C;--text:#e8f0fc;--muted:#6b82aa;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow-x:hidden;}

header{background:linear-gradient(135deg,var(–bg2),#0d1a38);border-bottom:2px solid var(–blue);padding:0 18px;display:flex;align-items:center;justify-content:space-between;height:58px;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(59,138,199,0.15);}
.brand{display:flex;align-items:baseline;gap:8px;}
.logo{font-family:‘Bebas Neue’,sans-serif;font-size:26px;color:var(–blue);letter-spacing:3px;}
.sub{font-size:12px;color:var(–muted);font-weight:300;letter-spacing:2px;text-transform:uppercase;}
.header-r{display:flex;align-items:center;gap:10px;}
.clock{font-family:‘Bebas Neue’,sans-serif;font-size:22px;color:var(–yellow);letter-spacing:2px;}
.btn-new{background:linear-gradient(135deg,var(–blue),#2a6fa8);color:#fff;border:none;border-radius:10px;padding:9px 18px;font-family:‘DM Sans’,sans-serif;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(59,138,199,0.35);transition:all 0.2s;}
.btn-new:hover{transform:translateY(-1px);}

.banner{background:linear-gradient(135deg,var(–bg2),var(–card));border-bottom:1px solid var(–border);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.b-left .lbl{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(–muted);margin-bottom:2px;}
.b-left .date{font-family:‘Bebas Neue’,sans-serif;font-size:24px;color:var(–text);letter-spacing:1px;}
.stats{display:flex;gap:10px;}
.stat{display:flex;flex-direction:column;align-items:center;background:var(–card2);border-radius:10px;padding:8px 14px;border:1px solid var(–border);min-width:72px;cursor:pointer;transition:all 0.2s;}
.stat:hover{transform:translateY(-2px);}
.stat .n{font-family:‘Bebas Neue’,sans-serif;font-size:26px;line-height:1;}
.stat .l{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(–muted);margin-top:2px;}
.stat.p .n{color:var(–yellow);}
.stat.t .n{color:var(–green);}
.stat.r .n{color:var(–red);}
.stat.g .n{color:var(–bluel);}

#notif-bar{margin:12px 18px 0;background:rgba(59,138,199,0.1);border:1px solid rgba(59,138,199,0.3);border-radius:10px;padding:10px 14px;font-size:12px;color:var(–bluel);display:none;align-items:center;gap:8px;}
#notif-bar.show{display:flex;}
#notif-bar button{margin-left:auto;background:var(–blue);color:#fff;border:none;border-radius:6px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer;}

<script>

var SBURL="https://sobiyfyzalynxcpfoldc.supabase.co",SBKEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNvYml5Znl6YWx5bnhjcGZvbGRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwMTA0MjksImV4cCI6MjA4ODU4NjQyOX0.FJOYHGjk-UI-SfEpZ2ytOvUJuTb4kGL9aBqj2ChXgek";

function pad(x){return String(x).padStart(2,"0");}

function tick(){
  var n=new Date();
  document.getElementById("clock").textContent=pad(n.getHours())+":"+pad(n.getMinutes());
}

function setHoy(){
  var n=new Date();
  var D=["DOMINGO","LUNES","MARTES","MIERCOLES","JUEVES","VIERNES","SABADO"];
  var M=["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
  document.getElementById("hoy").textContent=D[n.getDay()]+" "+n.getDate()+" "+M[n.getMonth()]+" "+n.getFullYear();
}

async function sbReq(path,opts){
  opts=opts||{};
  var res=await fetch(SBURL+"/rest/v1/"+path,{
    method:opts.method||"GET",
    headers:{"apikey":SBKEY,"Authorization":"Bearer "+SBKEY,"Content-Type":"application/json","Prefer":"return=representation"},
    body:opts.body||undefined
  });
  if(!res.ok) throw new Error(await res.text());
  var t=await res.text();
  return t?JSON.parse(t):[];
}

async function loadClientes(){
  try{
    var cli=await sbReq("clientes?select=id,nombre,direccion,telefono");
    var rev=[];
    try{rev=await sbReq("revisiones?select=nombre,direccion,telefono");}catch(e){}
    var seen={},lista=[];
    for(var i=0;i<cli.length;i++){
      if(!cli[i].nombre) continue;
      seen[cli[i].nombre.toLowerCase()]=1;
      lista.push({id:cli[i].id,nombre:cli[i].nombre,dir:cli[i].direccion||"",tel:cli[i].telefono||"",fuente:"cli"});
    }
    for(var i=0;i<rev.length;i++){
      if(!rev[i].nombre) continue;
      if(seen[rev[i].nombre.toLowerCase()]) continue;
      seen[rev[i].nombre.toLowerCase()]=1;
      lista.push({id:null,nombre:rev[i].nombre,dir:rev[i].direccion||"",tel:rev[i].telefono||"",fuente:"rev"});
    }
    lista.sort(function(a,b){return a.nombre.localeCompare(b.nombre,"es");});
    clientes=lista;
  }catch(e){console.error("loadClientes:",e);}
}

async function loadAvisos(){
  try{
    var d=await sbReq("avisos?select=*");

function updateCounters(){
  var p=0,t=0,r=0,g=0;
  for(var i=0;i<avisos.length;i++){
    var e=avisos[i].estado;
    if(e==="pendiente")p++;
    else if(e==="terminado")t++;
    else if(e==="rechazado")r++;
    else if(e==="guardado")g++;

async function siguienteNumero(){
  try{
    var year=new Date().getFullYear().toString().slice(-2);
    var prefix="HS"+year+"/";
    var max=0;
    for(var i=0;i<avisos.length;i++){
      var num=avisos[i].numero;
      if(num&&num.indexOf(prefix)===0){
        var n=parseInt(num.replace(prefix,""),10);
        if(!isNaN(n)&&n>max) max=n;
      }
    }
    return prefix+String(max+1).padStart(3,"0");
  }catch(e){return "HS26/001";}
}

  if(!rows.length){
    var lbl={pendiente:"pendientes",terminado:"terminados",rechazado:"rechazados",guardado:"guardados"};
    lista.innerHTML='<div class="empty"><div class="ico">&#128197;</div><p>No hay avisos '+(lbl[tabActual]||tabActual)+'</p></div>';
    return;
  }
  var html="";
  for(var i=0;i<rows.length;i++) html+=renderCard(rows[i]);
  lista.innerHTML=html;
}

function renderCard(a){
  var dt=new Date(a.fecha_hora);
  var DS=["Dom","Lun","Mar","Mie","Jue","Vie","Sab"];
  var MS=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  var fecha=DS[dt.getDay()]+" "+dt.getDate()+" "+MS[dt.getMonth()]+" "+dt.getFullYear()+" "+pad(dt.getHours())+":"+pad(dt.getMinutes());
  var imp=a.importe?parseFloat(a.importe).toFixed(2).replace(".",",")+"\u20AC":"-";
  var cd=getCountdown(dt,a.estado);
  var chips="";
  if(a.recordatorio_1) chips+='<span class="rc">&#128276; '+fmtRec(new Date(a.recordatorio_1))+'</span>';
  if(a.recordatorio_2) chips+='<span class="rc">&#128276; '+fmtRec(new Date(a.recordatorio_2))+'</span>';
  if(!chips&&a.estado==="pendiente") chips='<span style="font-size:11px;color:var(--muted)">Sin recordatorios</span>';
  var numHtml=a.numero?'<div class="card-num">'+a.numero+'</div>':"";
  var acts="";
  if(a.estado==="pendiente"){
    acts='<button class="ba ba-edit" onclick="editarAviso('+a.id+')">Editar</button>'+
         '<button class="ba ba-done" onclick="confTerminar('+a.id+')">Terminado</button>'+
         '<button class="ba ba-rej" onclick="confRechazar('+a.id+')">Rechazar</button>';
  } else if(a.estado==="terminado"){
    acts='<button class="ba ba-edit" onclick="editarAviso('+a.id+')">Ver</button>'+
         '<button class="ba ba-save" onclick="guardarHistorico('+a.id+')">&#128190; Guardar</button>';
  } else {
    acts='<button class="ba ba-edit" onclick="editarAviso('+a.id+')">Ver</button>';
  }
  var estadoShow=a.estado;
  return '<div class="card '+a.estado+'">'+
    '<div class="card-top">'+
      '<div class="card-left">'+
        numHtml+
        '<div class="card-fecha">'+fecha+'</div>'+
        '<div class="card-nombre">'+(a.nombre_cliente||"-")+'</div>'+
        '<div class="card-trabajo">'+(a.tipo_trabajo||"-")+'</div>'+
        cd+
      '</div>'+
      '<div class="card-right">'+
        '<span class="ebadge '+estadoShow+'">'+estadoShow+'</span>'+
        '<div class="importe">'+imp+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="card-bot">'+chips+'<div class="acts">'+acts+'</div></div>'+
  '</div>';
}

function getCountdown(dt,estado){
  if(estado!=="pendiente") return "";
  var now=new Date(),diff=dt-now;
  if(diff<0) return '<div class="cd urg">Cita pasada</div>';
  var h=Math.floor(diff/3600000),m=Math.floor((diff%3600000)/60000);
  if(h===0&&m<60) return '<div class="cd urg">En '+m+' min</div>';
  if(h<24) return '<div class="cd warn">En '+h+'h '+m+'min</div>';
  var d=Math.floor(h/24);
  return '<div class="cd ok">En '+d+' dia'+(d>1?"s":"")+'</div>';
}

function fmtRec(dt){
  var D=["Dom","Lun","Mar","Mie","Jue","Vie","Sab"];
  return D[dt.getDay()]+" "+dt.getDate()+" "+pad(dt.getHours())+":"+pad(dt.getMinutes());
}

/* BUSCADOR CLIENTE */
function filtrarCli(val){
  var drop=document.getElementById("cli-drop");
  var f=(val||"").toLowerCase().trim();
  var lista=f?clientes.filter(function(c){return c.nombre.toLowerCase().indexOf(f)!==-1;}):clientes;
  if(!lista.length){drop.style.display="none";return;}
  var html="";
  for(var i=0;i<lista.length;i++){
    var c=lista[i];
    var etiq=c.nombre+(c.dir?" \u2014 "+c.dir:"")+(c.fuente==="rev"?" [Rev]":"");
    html+='<div class="cli-item" data-id="'+(c.id!==null?c.id:"R:"+c.nombre)+'" data-nombre="'+c.nombre.replace(/"/g,"&quot;")+'" data-dir="'+c.dir.replace(/"/g,"&quot;")+'" data-tel="'+c.tel.replace(/"/g,"&quot;")+'">'+etiq+'</div>';
  }
  drop.innerHTML=html;
  drop.style.display="block";
  var items=drop.querySelectorAll(".cli-item");
  for(var j=0;j<items.length;j++){
    (function(el){
      el.addEventListener("touchstart",function(e){
        e.preventDefault();
        elegirCli(el.dataset.id,el.dataset.nombre,el.dataset.dir,el.dataset.tel);
      },{passive:false});
      el.addEventListener("click",function(){
        elegirCli(el.dataset.id,el.dataset.nombre,el.dataset.dir,el.dataset.tel);
      });
    })(items[j]);
  }
}

function elegirCli(id,nombre,dir,tel){
  cliSelId=id; cliSelNombre=nombre; cliSelDir=dir||""; cliSelTel=tel||"";
  document.getElementById("cli-q").value="";
  document.getElementById("cli-drop").style.display="none";
  document.getElementById("cli-sel-name").textContent=nombre;
  document.getElementById("cli-sel").style.display="flex";
}

function limpiarCli(){
  cliSelId=null; cliSelNombre=""; cliSelDir=""; cliSelTel="";
  document.getElementById("cli-sel").style.display="none";
  document.getElementById("cli-q").value="";
  document.getElementById("cli-drop").style.display="none";
}

function togManual(){
  var chk=document.getElementById("chk-manual").checked;
  document.getElementById("fg-manual").style.display=chk?"block":"none";
  document.getElementById("fg-lista").style.display=chk?"none":"block";
  if(chk) limpiarCli();
  else{ document.getElementById("fcli-manual").value=""; document.getElementById("fman-dir").value=""; document.getElementById("fman-tel").value=""; }
}

function abrirModal(a){
  a=a||null; editId=a?a.id:null;
  document.getElementById("mtitle").textContent=a?"EDITAR AVISO":"NUEVO AVISO";
  document.getElementById("ftrab").value="";
  document.getElementById("fhora").value="09:00";
  document.getElementById("fimp").value="";
  document.getElementById("fnotas").value="";
  document.getElementById("chk-manual").checked=false;
  document.getElementById("fg-manual").style.display="none";
  document.getElementById("fg-lista").style.display="block";
  document.getElementById("fcli-manual").value="";
  document.getElementById("fman-dir").value="";
  document.getElementById("fman-tel").value="";
  limpiarCli();
  recsOn={"1h":true};
  var rbs=document.querySelectorAll(".rb");
  rbs[0].classList.add("on");rbs[1].classList.remove("on");rbs[2].classList.remove("on");
  document.getElementById("crec").classList.remove("show");
  if(a){
    if(a.cliente_id){
      elegirCli(String(a.cliente_id),a.nombre_cliente||"","",a.telefono||"");
    } else if(a.nombre_cliente){
      document.getElementById("chk-manual").checked=true;
      document.getElementById("fg-manual").style.display="block";
      document.getElementById("fg-lista").style.display="none";
      document.getElementById("fcli-manual").value=a.nombre_cliente;
    }
    document.getElementById("ftrab").value=a.tipo_trabajo||"";
    var dt=new Date(a.fecha_hora);
    document.getElementById("ffecha").value=dt.toISOString().split("T")[0];
    document.getElementById("fhora").value=pad(dt.getHours())+":"+pad(dt.getMinutes());
    document.getElementById("fimp").value=a.importe||"";
    document.getElementById("fnotas").value=a.notas||"";
  } else {
    document.getElementById("ffecha").value=new Date().toISOString().split("T")[0];
  }
  document.getElementById("ov").classList.add("show");
}

function cerrarModal(){document.getElementById("ov").classList.remove("show");editId=null;}
function closeOv(e){if(e.target===document.getElementById("ov")) cerrarModal();}

function togRec(t,btn){
  if(t==="custom"){
    var cr=document.getElementById("crec");
    if(recsOn.custom){delete recsOn.custom;btn.classList.remove("on");cr.classList.remove("show");}
    else{recsOn.custom=true;btn.classList.add("on");cr.classList.add("show");}
    return;
  }
  if(recsOn[t]){delete recsOn[t];btn.classList.remove("on");}
  else{recsOn[t]=true;btn.classList.add("on");}
}

async function guardar(){
  var esManual=document.getElementById("chk-manual").checked;
  var nombreManual=document.getElementById("fcli-manual").value.trim();
  var dirManual=document.getElementById("fman-dir").value.trim();
  var telManual=document.getElementById("fman-tel").value.trim();
  var trab=document.getElementById("ftrab").value.trim();
  var fecha=document.getElementById("ffecha").value;
  var hora=document.getElementById("fhora").value;
  var imp=document.getElementById("fimp").value;
  var notas=document.getElementById("fnotas").value.trim();

  if(esManual&&!nombreManual){showToast("Escribe el nombre del cliente","error");return;}
  if(!esManual&&!cliSelId){showToast("Selecciona un cliente de la lista","error");return;}
  if(!trab||!fecha){showToast("Trabajo y fecha son obligatorios","error");return;}

  var btn=document.getElementById("bsave");
  btn.disabled=true; btn.textContent="Guardando...";

  try{
    var realId=null, realNombre="", realTel="";

    if(esManual){
      realNombre=nombreManual; realTel=telManual;
      var nc=await sbReq("clientes",{method:"POST",body:JSON.stringify({nombre:realNombre,direccion:dirManual,telefono:realTel})});
      if(nc&&nc.length>0) realId=nc[0].id;
    } else {
      var idStr=String(cliSelId);
      if(idStr.indexOf("R:")===0){
        realNombre=cliSelNombre; realTel=cliSelTel;
        var existe=await sbReq("clientes?nombre=eq."+encodeURIComponent(realNombre)+"&select=id");
        if(existe&&existe.length>0){
          realId=existe[0].id;
        } else {
          var nc2=await sbReq("clientes",{method:"POST",body:JSON.stringify({nombre:realNombre,direccion:cliSelDir,telefono:cliSelTel})});
          if(nc2&&nc2.length>0) realId=nc2[0].id;
        }
      } else {
        realId=parseInt(idStr);
        realNombre=cliSelNombre; realTel=cliSelTel;
      }
    }

    var fh=new Date(fecha+"T"+hora+":00").toISOString();
    var dtC=new Date(fecha+"T"+hora+":00");
    var r1=null,r2=null;
    if(recsOn["1h"]){var rr=new Date(dtC.getTime()-3600000);if(!r1)r1=rr.toISOString();else r2=rr.toISOString();}
    if(recsOn["1d"]){var rr=new Date(dtC.getTime()-86400000);if(!r1)r1=rr.toISOString();else r2=rr.toISOString();}
    if(recsOn.custom){
      var rf=document.getElementById("frf").value,rh=document.getElementById("frh").value;
      if(rf&&rh){var rr=new Date(rf+"T"+rh+":00").toISOString();if(!r1)r1=rr;else r2=rr;}
    }

    var numero=editId?(avisos.find(function(x){return x.id===editId;})||{}).numero||"":await siguienteNumero();
    var payload={cliente_id:realId,nombre_cliente:realNombre,tipo_trabajo:trab,fecha_hora:fh,importe:imp?parseFloat(imp):0,notas:notas,telefono:realTel,recordatorio_1:r1,recordatorio_2:r2,estado:"pendiente",numero:numero};

    if(editId){
      await sbReq("avisos?id=eq."+editId,{method:"PATCH",body:JSON.stringify(payload)});
      showToast("Aviso actualizado","success");
    } else {
      await sbReq("avisos",{method:"POST",body:JSON.stringify(payload)});
      showToast(numero+" creado","success");
    }
    cerrarModal();
    await loadClientes();
    await loadAvisos();
    render();
  }catch(e){
    console.error(e);
    showToast("Error: "+e.message,"error");
  }finally{
    btn.disabled=false; btn.textContent="Guardar aviso";
  }
}

function editarAviso(id){for(var i=0;i<avisos.length;i++){if(avisos[i].id===id){abrirModal(avisos[i]);return;}}}

function confTerminar(id){
  var a=null;for(var i=0;i<avisos.length;i++){if(avisos[i].id===id){a=avisos[i];break;}}
  if(!a) return;
  document.getElementById("cbox").innerHTML=
    '<h3 style="color:var(--green)">MARCAR TERMINADO</h3>'+
    '<p>'+(a.numero?'<strong>'+a.numero+'</strong> &mdash; ':'')+a.nombre_cliente+'</p>'+
    '<div class="fg" style="text-align:left;margin-bottom:10px"><label class="fl">Cobrado (\u20AC)</label>'+
    '<input type="number" class="fc" id="icob" step="0.01" value="'+(a.importe||0)+'"></div>'+
    '<div class="fg" style="text-align:left;margin-bottom:18px"><label class="fl">Pendiente de cobro (\u20AC)</label>'+
    '<input type="number" class="fc" id="ipen" step="0.01" value="0"></div>'+
    '<div class="cbtns"><button class="bcc" onclick="cerrarConf()">Cancelar</button>'+
    '<button class="bco green" onclick="terminar('+id+')">Confirmar</button></div>';
  document.getElementById("cov").classList.add("show");
}

function confRechazar(id){
  var a=null;for(var i=0;i<avisos.length;i++){if(avisos[i].id===id){a=avisos[i];break;}}
  if(!a) return;
  document.getElementById("cbox").innerHTML=
    '<h3 style="color:var(--red)">RECHAZAR AVISO</h3>'+
    '<p>Se marcara como rechazado el aviso de <strong>'+a.nombre_cliente+'</strong>.</p>'+
    '<div class="cbtns" style="margin-top:18px"><button class="bcc" onclick="cerrarConf()">Cancelar</button>'+
    '<button class="bco red" onclick="rechazar('+id+')">Rechazar</button></div>';
  document.getElementById("cov").classList.add("show");
}

function cerrarConf(){document.getElementById("cov").classList.remove("show");}

async function terminar(id){
  var a=null;for(var i=0;i<avisos.length;i++){if(avisos[i].id===id){a=avisos[i];break;}}
  if(!a) return;
  var cob=parseFloat(document.getElementById("icob").value)||0;
  var pen=parseFloat(document.getElementById("ipen").value)||0;
  try{
    await sbReq("avisos?id=eq."+id,{method:"PATCH",body:JSON.stringify({estado:"terminado"})});
    if(a.cliente_id){
      await sbReq("clientes?id=eq."+a.cliente_id,{method:"PATCH",body:JSON.stringify({
        trabajo:a.tipo_trabajo,presupuesto:parseFloat(a.importe)||0,
        cobrado:cob,pendiente:pen,terminado:pen===0,
        updated_at:new Date().toISOString()
      })});
    }
    cerrarConf();
    showToast("Terminado \u2014 datos enviados a Clientes","success");
    await loadAvisos(); render();
  }catch(e){console.error(e);showToast("Error: "+e.message,"error");}
}

async function rechazar(id){
  try{
    await sbReq("avisos?id=eq."+id,{method:"PATCH",body:JSON.stringify({estado:"rechazado"})});
    cerrarConf();showToast("Aviso rechazado","error");
    await loadAvisos();render();
  }catch(e){showToast("Error","error");}
}

async function guardarHistorico(id){
  try{
    await sbReq("avisos?id=eq."+id,{method:"PATCH",body:JSON.stringify({estado:"guardado"})});
    showToast("Guardado en histerico","success");
    await loadAvisos(); render();
  }catch(e){showToast("Error","error");}
}

async function pedirNotif(){
  var p=await Notification.requestPermission();
  if(p==="granted"){document.getElementById("notif-bar").classList.remove("show");showToast("Notificaciones activadas","success");}
}

function checkRecs(){
  if(Notification.permission!=="granted") return;
  var now=new Date(),margen=60000;
  for(var i=0;i<avisos.length;i++){
    var a=avisos[i];if(a.estado!=="pendiente") continue;
    var recs=[a.recordatorio_1,a.recordatorio_2];
    for(var j=0;j<recs.length;j++){
      if(!recs[j]) continue;
      var dt=new Date(recs[j]);
      if(Math.abs(dt-now)<margen){
        var c=new Date(a.fecha_hora);
        new Notification("HAROSAT \u2014 "+(a.numero||"Cita"),{
          body:a.nombre_cliente+" \u2014 "+a.tipo_trabajo+"\n"+pad(c.getHours())+":"+pad(c.getMinutes()),
          tag:"av-"+a.id+"-"+j
        });
      }
    }
  }
}

function showToast(msg,type){
  type=type||"info";
  var t=document.getElementById("toast");
  t.textContent=msg;t.className="toast show "+type;
  setTimeout(function(){t.className="toast";},3000);
}

document.addEventListener("DOMContentLoaded",async function(){
  tick();setInterval(tick,1000);
  setHoy();
  document.getElementById("lista").innerHTML='<div class="loading"><div class="spinner"></div> Cargando...</div>';
  await loadClientes();
  await loadAvisos();
  render();
  if(Notification.permission==="default") document.getElementById("notif-bar").classList.add("show");
  setInterval(checkRecs,60000);
  checkRecs();
});

</script>
