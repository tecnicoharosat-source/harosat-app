<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Contrato HAROSAT">
<link rel="apple-touch-icon" href="https://tecnicoharosat-source.github.io/harosat-app/icono-contrato.png">
<link rel="icon" type="image/png" href="https://tecnicoharosat-source.github.io/harosat-app/icono-contrato.png">
<title>Contrato Mantenimiento — HAROSAT</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"><\/script>
<style>
:root{--bg:#060910;--surface:#0d1117;--card:#111827;--border:#1f2937;--blue:#2563a8;--blue-light:#3B8AC7;--yellow:#FDB913;--text:#f0f4f8;--muted:#6b7280;--ok:#10b981;--err:#ef4444;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
header{background:var(--surface);border-bottom:2px solid var(--blue);padding:0 14px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;}
.logo-app{height:40px;width:auto;}
.hdr-title{font-size:12px;font-weight:600;color:var(--yellow);text-transform:uppercase;letter-spacing:.5px;}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:600;}
.badge-warn{background:rgba(253,185,19,.15);color:var(--yellow);}
.badge-ok{background:rgba(16,185,129,.15);color:var(--ok);}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor;}
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);}
.tab{flex:1;padding:11px 4px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:'Outfit',sans-serif;font-size:11px;font-weight:500;cursor:pointer;transition:.2s;white-space:nowrap;}
.tab.on{color:var(--blue-light);border-bottom-color:var(--blue-light);}
.sec{display:none;padding:14px;}
.sec.on{display:block;}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:11px;}
.ctitle{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:11px;display:flex;align-items:center;gap:7px;}
.ctitle::before{content:'';width:3px;height:11px;background:var(--blue-light);border-radius:2px;}
.f{margin-bottom:10px;}
.f label{display:block;font-size:10px;color:var(--muted);margin-bottom:3px;font-weight:500;}
.f input,.f select{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:9px 11px;color:var(--text);font-family:'Outfit',sans-serif;font-size:13px;outline:none;transition:.2s;}
.f input:focus,.f select:focus{border-color:var(--blue-light);}
.f select option{background:var(--card);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:7px;border:none;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:.2s;width:100%;margin-bottom:8px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-blue{background:var(--blue);color:#fff;}
.btn-yellow{background:var(--yellow);color:#111;}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn-ok{background:var(--ok);color:#fff;}
.btn-wa{background:#25d366;color:#fff;}
.btn-gm{background:#ea4335;color:#fff;}
.btn-dl{background:#6366f1;color:#fff;}
.btn-sm{padding:7px 12px;font-size:11px;margin-bottom:0;}
.g2btn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.ir{display:flex;justify-content:space-between;font-size:11px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.ir span:first-child{color:var(--muted);}
.ir span:last-child{font-weight:500;}
.div{height:1px;background:var(--border);margin:12px 0;}
#canvas-f{width:100%;height:170px;background:#fff;border-radius:7px;border:2px dashed var(--border);display:block;touch-action:none;cursor:crosshair;}
.sig-opts{display:flex;gap:7px;margin-bottom:12px;}
.sopt{flex:1;padding:9px;border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:6px;font-family:'Outfit',sans-serif;font-size:11px;font-weight:500;cursor:pointer;transition:.2s;}
.sopt.on{border-color:var(--blue-light);background:rgba(59,138,199,.1);color:var(--blue-light);}
.sig-ctrl{display:flex;gap:7px;margin-top:8px;}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--card);border:1px solid var(--border);border-radius:7px;padding:10px 18px;font-size:12px;font-weight:500;z-index:9999;transition:.3s;white-space:nowrap;max-width:92vw;}
#toast.show{transform:translateX(-50%) translateY(0);}
#toast.ok{border-color:var(--ok);color:var(--ok);}
#toast.err{border-color:var(--err);color:var(--err);}
@keyframes spin{to{transform:rotate(360deg);}}
.spin{display:inline-block;animation:spin .7s linear infinite;}
</style>
</head>
<body>
<header>
  <img class="logo-app" src="https://tecnicoharosat-source.github.io/harosat-app/logo-harosat-app.png" alt="HAROSAT">
  <div class="hdr-title">Contrato Mant.</div>
  <div id="badge" class="badge badge-warn"><span class="dot"></span>Borrador</div>
</header>
<div class="tabs">
  <button class="tab on" onclick="tab('datos')">📋 Datos</button>
  <button class="tab" onclick="tab('firma')">✍️ Firma</button>
  <button class="tab" onclick="tab('enviar')">📤 Enviar</button>
</div>

<div id="sec-datos" class="sec on">
  <div class="card">
    <div class="ctitle">Datos del Aparato</div>
    <div class="g2">
      <div class="f"><label>Nº Contrato</label><input id="d-numcont" placeholder="CM/26/001"></div>
      <div class="f"><label>Entrada en Vigor</label><input id="d-vigor" type="date"></div>
    </div>
    <div class="f"><label>Tipo Elemento</label>
      <select id="d-tipo">
        <option>Caldera de gas</option><option>Caldera de gasoleo</option>
        <option>Bomba de calor</option><option>Aerotermia</option>
        <option>Climatizacion (splits)</option><option>Suelo radiante</option><option>Otro</option>
      </select>
    </div>
    <div class="g2">
      <div class="f"><label>Marca</label><input id="d-marca" placeholder="Thermor"></div>
      <div class="f"><label>Modelo</label><input id="d-modelo" placeholder="Logic Micro 30kW"></div>
    </div>
    <div class="f"><label>Numero de Serie</label><input id="d-serie" placeholder="opcional"></div>
  </div>
  <div class="card">
    <div class="ctitle">Datos del Usuario</div>
    <div class="f"><label>Nombre completo *</label><input id="u-nombre" placeholder="Nombre y apellidos"></div>
    <div class="f"><label>Domicilio</label><input id="u-dir" placeholder="Calle, numero, piso"></div>
    <div class="g3">
      <div class="f"><label>CP</label><input id="u-cp" placeholder="26200"></div>
      <div class="f" style="grid-column:span 2"><label>Localidad</label><input id="u-loc" placeholder="Haro"></div>
    </div>
    <div class="f"><label>Provincia</label><input id="u-prov" value="La Rioja" placeholder="La Rioja"></div>
    <div class="g2">
      <div class="f"><label>NIF/DNI</label><input id="u-nif" placeholder="00000000X"></div>
      <div class="f"><label>Telefono</label><input id="u-tel" type="tel" placeholder="600 000 000"></div>
    </div>
    <div class="f"><label>Email</label><input id="u-email" type="email" placeholder="cliente@email.com"></div>
  </div>
  <div class="card">
    <div class="ctitle">Domicilio de Cobro</div>
    <div class="f"><label>Domicilio de cobro (si difiere)</label><input id="u-cobro" placeholder="Igual que domicilio"></div>
    <div class="f"><label>IBAN</label><input id="u-iban" placeholder="ES00 0000 0000 00 0000000000"></div>
  </div>
  <div class="card">
    <div class="ctitle">Importes</div>
    <div class="g2">
      <div class="f"><label>Base Imponible (EUR)</label><input id="i-base" type="number" placeholder="148.76" oninput="calcIva()"></div>
      <div class="f"><label>IVA 21% (EUR)</label><input id="i-iva" readonly placeholder="0.00" style="color:var(--muted)"></div>
    </div>
    <div class="f"><label>Total (EUR)</label><input id="i-total" readonly placeholder="180.00" style="color:var(--yellow);font-weight:600"></div>
  </div>
  <button class="btn btn-blue" onclick="tab('firma')">Pasar a firma</button>
</div>

<div id="sec-firma" class="sec">
  <div class="card">
    <div class="ctitle">Firma del cliente</div>
    <div class="sig-opts">
      <button class="sopt on" id="sopt-m" onclick="modoFirma('manual')">Con el dedo</button>
      <button class="sopt" id="sopt-a" onclick="modoFirma('auto')">Automatica</button>
    </div>
    <div id="wrap-manual">
      <p style="font-size:11px;color:var(--muted);margin-bottom:7px;">Firme con el dedo en el recuadro blanco:</p>
      <canvas id="canvas-f"></canvas>
      <div class="sig-ctrl">
        <button class="btn btn-ghost btn-sm" style="flex:1" onclick="borrarFirma()">Borrar</button>
        <button class="btn btn-ok btn-sm" style="flex:2" onclick="aceptarFirmaManual()">Aceptar firma</button>
      </div>
    </div>
    <div id="wrap-auto" style="display:none;">
      <p style="font-size:11px;color:var(--muted);margin-bottom:7px;">Firma automatica con nombre del cliente:</p>
      <canvas id="canvas-auto" height="110" style="width:100%;background:#fff;border-radius:7px;border:1px solid var(--border);display:block;"></canvas>
      <button class="btn btn-ok" style="margin-top:8px;" onclick="aceptarFirmaAuto()">Generar y aceptar</button>
    </div>
  </div>
  <div class="card" id="card-firmado" style="display:none;">
    <div class="ctitle">Firma guardada</div>
    <div style="text-align:center;padding:10px 0;">
      <img id="prev-firma" style="max-height:85px;max-width:100%;background:#fff;border-radius:6px;padding:6px;">
    </div>
    <div id="ts-firma" style="font-size:10px;color:var(--muted);text-align:center;"></div>
    <div class="div"></div>
    <button class="btn btn-ghost btn-sm" onclick="rehacerFirma()">Volver a firmar</button>
  </div>
  <button class="btn btn-yellow" onclick="tab('enviar')">Preparar envio</button>
</div>

<div id="sec-enviar" class="sec">
  <div class="card">
    <div class="ctitle">Resumen</div>
    <div id="resumen"></div>
    <div class="div"></div>
    <div class="ir"><span>Datos</span><span id="st-d">-</span></div>
    <div class="ir"><span>Firma</span><span id="st-f">-</span></div>
  </div>
  <div class="card">
    <div class="ctitle">Generar PDF</div>
    <button class="btn btn-dl" id="btn-pdf" onclick="generarPDF()">Generar PDF del contrato</button>
    <p id="pdf-info" style="font-size:11px;color:var(--muted);text-align:center;display:none;margin-top:4px;"></p>
  </div>
  <div class="card" id="card-envio" style="display:none;">
    <div class="ctitle">Descargar / Enviar</div>
    <button class="btn btn-dl" onclick="descargar()">Descargar PDF</button>
    <div class="g2btn">
      <button class="btn btn-wa" onclick="envWA()">WhatsApp</button>
      <button class="btn btn-gm" onclick="envGmail()">Gmail</button>
    </div>
    <button class="btn btn-ghost" id="btn-share" style="display:none;" onclick="compartir()">Compartir</button>
  </div>
</div>

<div id="toast"></div>

<script>
var LOGO_PDF_URL='https://tecnicoharosat-source.github.io/harosat-app/logo-harosat-pdf.png';
var firmaImg=null,firmaTs=null,pdfBlob=null,pdfNombre='contrato.pdf';
var canvasInited=false,cvs,cctx,drawing=false;
var logoPdfCache=null;

function tab(id){
  document.querySelectorAll('.sec').forEach(function(s){s.classList.remove('on');});
  document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('on');});
  document.getElementById('sec-'+id).classList.add('on');
  ['datos','firma','enviar'].forEach(function(t,i){if(t===id)document.querySelectorAll('.tab')[i].classList.add('on');});
  if(id==='firma'&&!canvasInited){setTimeout(initCanvas,80);canvasInited=true;}
  if(id==='enviar')actualizarResumen();
}

function v(id,fb){var e=document.getElementById(id);return e&&e.value.trim()?e.value.trim():(fb||'');}

function calcIva(){
  var base=parseFloat(document.getElementById('i-base').value)||0;
  var iva=base*0.21,tot=base+iva;
  document.getElementById('i-iva').value=iva?iva.toFixed(2):'';
  document.getElementById('i-total').value=tot?tot.toFixed(2):'';
}

function fmtFecha(iso){
  if(!iso)return'';
  return new Date(iso+'T00:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'});
}

function initCanvas(){
  cvs=document.getElementById('canvas-f');
  cctx=cvs.getContext('2d');
  var dpr=window.devicePixelRatio||1;
  cvs.width=cvs.offsetWidth*dpr; cvs.height=170*dpr;
  cctx.scale(dpr,dpr);
  cctx.strokeStyle='#1a1a2e'; cctx.lineWidth=2.5; cctx.lineCap='round'; cctx.lineJoin='round';
  cvs.addEventListener('touchstart',function(e){e.preventDefault();drawing=true;var r=cvs.getBoundingClientRect();cctx.beginPath();cctx.moveTo(e.touches[0].clientX-r.left,e.touches[0].clientY-r.top);},{passive:false});
  cvs.addEventListener('touchmove',function(e){e.preventDefault();if(!drawing)return;var r=cvs.getBoundingClientRect();cctx.lineTo(e.touches[0].clientX-r.left,e.touches[0].clientY-r.top);cctx.stroke();},{passive:false});
  cvs.addEventListener('touchend',function(){drawing=false;});
  cvs.addEventListener('mousedown',function(e){drawing=true;var r=cvs.getBoundingClientRect();cctx.beginPath();cctx.moveTo(e.clientX-r.left,e.clientY-r.top);});
  cvs.addEventListener('mousemove',function(e){if(!drawing)return;var r=cvs.getBoundingClientRect();cctx.lineTo(e.clientX-r.left,e.clientY-r.top);cctx.stroke();});
  cvs.addEventListener('mouseup',function(){drawing=false;});
  cvs.addEventListener('mouseleave',function(){drawing=false;});
}

function borrarFirma(){if(cctx)cctx.clearRect(0,0,cvs.width,cvs.height);}

function aceptarFirmaManual(){
  var data=cctx.getImageData(0,0,cvs.width,cvs.height).data;
  var hay=false; for(var i=3;i<data.length;i+=4){if(data[i]>0){hay=true;break;}}
  if(!hay){toast('Firme en el recuadro primero','err');return;}
  var tmp=document.createElement('canvas'); tmp.width=cvs.width; tmp.height=cvs.height;
  var tc=tmp.getContext('2d'); tc.fillStyle='#fff'; tc.fillRect(0,0,tmp.width,tmp.height); tc.drawImage(cvs,0,0);
  firmaImg=tmp.toDataURL('image/png'); firmaTs=new Date().toLocaleString('es-ES'); mostrarFirmada();
}

function aceptarFirmaAuto(){
  var nombre=v('u-nombre'); if(!nombre){toast('Introduce el nombre primero','err');return;}
  var c=document.getElementById('canvas-auto'); var dpr=window.devicePixelRatio||1;
  c.width=c.offsetWidth*dpr; c.height=110*dpr; var cx=c.getContext('2d'); cx.scale(dpr,dpr);
  var W=c.offsetWidth; cx.fillStyle='#fff'; cx.fillRect(0,0,W,110);
  cx.font='italic 300 36px Georgia,serif'; cx.fillStyle='#1a2a4a'; cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText(nombre,W/2,44); cx.strokeStyle='#bbb'; cx.lineWidth=1;
  cx.beginPath(); cx.moveTo(W*0.08,72); cx.lineTo(W*0.92,72); cx.stroke();
  firmaTs=new Date().toLocaleString('es-ES');
  cx.font='9px monospace'; cx.fillStyle='#999'; cx.fillText(firmaTs,W/2,88);
  firmaImg=c.toDataURL('image/png'); mostrarFirmada();
}

function mostrarFirmada(){
  document.getElementById('card-firmado').style.display='';
  document.getElementById('prev-firma').src=firmaImg;
  document.getElementById('ts-firma').textContent='Firmado: '+firmaTs;
  document.getElementById('badge').className='badge badge-ok';
  document.getElementById('badge').innerHTML='<span class="dot"></span>Firmado';
  pdfBlob=null; document.getElementById('card-envio').style.display='none';
  toast('Firma guardada','ok');
}

function rehacerFirma(){
  firmaImg=null; firmaTs=null; pdfBlob=null;
  document.getElementById('card-firmado').style.display='none';
  document.getElementById('card-envio').style.display='none';
  document.getElementById('badge').className='badge badge-warn';
  document.getElementById('badge').innerHTML='<span class="dot"></span>Borrador';
  if(cctx)cctx.clearRect(0,0,cvs.width,cvs.height);
}

function modoFirma(m){
  document.getElementById('sopt-m').classList.toggle('on',m==='manual');
  document.getElementById('sopt-a').classList.toggle('on',m==='auto');
  document.getElementById('wrap-manual').style.display=m==='manual'?'':'none';
  document.getElementById('wrap-auto').style.display=m==='auto'?'':'none';
}

function badge2(t,l){return'<span class="badge badge-'+t+'"><span class="dot"></span>'+l+'</span>';}

function actualizarResumen(){
  var n=v('u-nombre','-'),nc=v('d-numcont','-'),tipo=v('d-tipo','-'),tot=v('i-total','-');
  document.getElementById('resumen').innerHTML=
    '<div class="ir"><span>Contrato</span><span>'+nc+'</span></div>'+
    '<div class="ir"><span>Cliente</span><span>'+n+'</span></div>'+
    '<div class="ir"><span>Equipo</span><span>'+tipo+'</span></div>'+
    '<div class="ir"><span>Total</span><span>'+(tot!='-'?tot+' EUR':'-')+'</span></div>';
  document.getElementById('st-d').innerHTML=(v('u-nombre')&&v('d-numcont'))?badge2('ok','OK'):badge2('warn','Incompleto');
  document.getElementById('st-f').innerHTML=firmaImg?badge2('ok','Firmado'):badge2('warn','Pendiente');
  if(navigator.share)document.getElementById('btn-share').style.display='';
}

function getLogo(cb){
  if(logoPdfCache){cb(logoPdfCache);return;}
  var img=new Image(); img.crossOrigin='anonymous';
  img.onload=function(){
    var c=document.createElement('canvas'); c.width=img.width; c.height=img.height;
    c.getContext('2d').drawImage(img,0,0);
    logoPdfCache=c.toDataURL('image/png'); cb(logoPdfCache);
  };
  img.onerror=function(){cb(null);};
  img.src=LOGO_PDF_URL;
}

function drawHeader(doc,pagNum,logoData){
  var PW=210,ML=12,MR=12,MT=6;
  if(logoData){try{doc.addImage(logoData,'PNG',ML,MT,38,24);}catch(e){}}
  doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(30,30,30);
  var dx=ML+42,dy=MT+4;
  doc.text('STA. LUCIA 66, BJ',dx,dy);
  doc.text('26200 HARO',dx,dy+4);
  doc.text('LA RIOJA',dx,dy+8);
  doc.setFont('helvetica','bold');
  doc.text('Tfno  640 05 64 84  //  WhatsApp  613 68 49 79',dx,dy+13);
  doc.setFont('helvetica','normal');
  doc.text('harosatecnicos@gmail.com    harosat.es',dx,dy+18);
  var cdrX=128;
  doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(10,10,10);
  doc.text('Instalacion y mantenimiento de climatizacion,',cdrX,MT+4);
  doc.text('gas, gasoleo y aire acondicionado.',cdrX,MT+8.5);
  doc.text('Instalador IG-III, RITE, agente puesta en marcha,',cdrX,MT+13);
  doc.text('mantenimiento, reparacion y adecuacion a gas.',cdrX,MT+17.5);
  doc.setFontSize(8.5); doc.text('CIF/NIF 09302345H',cdrX,MT+23);
  doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
  doc.text('LUNES A VIERNES',cdrX,MT+29);
  doc.setDrawColor(0); doc.setLineWidth(0.4); doc.rect(PW-MR-6,MT+25,5,5);
  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.text('X',PW-MR-4.8,MT+29.5);
  var sepY=MT+33;
  doc.setDrawColor(0); doc.setLineWidth(0.8); doc.line(ML,sepY,PW-MR,sepY);
  doc.setLineWidth(0.3); doc.line(ML,sepY+1.5,PW-MR,sepY+1.5);
  var titY=sepY+4;
  doc.setDrawColor(0); doc.setLineWidth(0.5); doc.rect(ML+18,titY,146,8,'S');
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(10,10,10);
  doc.text('CONTRATO DE CONSERVACION Y PREVENCION DE AVERIAS',ML+91,titY+5.5,{align:'center'});
  doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
  doc.text('Pagina '+pagNum+' de 2',PW-MR-2,titY+5.5,{align:'right'});
  return titY+10;
}

function drawPie(doc){
  var pie=287;
  doc.setDrawColor(0); doc.setLineWidth(0.4); doc.line(12,pie-4,198,pie-4);
  doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(10,10,10);
  doc.text('HAROSAT ECOTECHNICAL',12,pie);
  doc.text('CONTRATO DE CONSERVACION Y PREVENCION DE AVERIAS',105,pie,{align:'center'});
  doc.setFont('helvetica','normal'); doc.setFontSize(6.5);
  doc.text('STA. LUCIA 66, BJ · 26200 HARO · LA RIOJA · 640 05 64 84 · harosatecnicos@gmail.com',105,pie+3.5,{align:'center'});
}

function generarPDF(){
  var btn=document.getElementById('btn-pdf'),info=document.getElementById('pdf-info');
  btn.disabled=true; btn.innerHTML='Generando...';

}

    var c2=[
      '11. El pago debera ser abonado dentro del primer mes de la entrada en vigor o de sus prorrogas, reservandose la empresa mantenedora el derecho a prestar servicio si el importe no ha sido satisfecho.',

      '17. De conformidad con la Ley Organica 15/1999 de Proteccion de Datos, los datos seran incorporados a un fichero de la empresa mantenedora. El usuario podra ejercitar los derechos de acceso, rectificacion, cancelacion y oposicion dirigiendose a harosatecnicos@gmail.com',

function descargar(){
  if(!pdfBlob){toast('Genera el PDF primero','err');return;}
  var url=URL.createObjectURL(pdfBlob);
  var a=document.createElement('a'); a.href=url; a.download=pdfNombre;
  document.body.appendChild(a); a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},1000);
  toast('Descargando...','ok');
}

function envWA(){
  var tel=v('u-tel').replace(/\s/g,''),nc=v('d-numcont','contrato'),nom=v('u-nombre','cliente');
  if(pdfBlob&&navigator.share&&navigator.canShare){
    var file=new File([pdfBlob],pdfNombre,{type:'application/pdf'});
    if(navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Contrato HAROSAT '+nc});return;}
  }
  var msg=encodeURIComponent('Contrato Mantenimiento HAROSAT
Ref: '+nc+'

Estimado/a '+nom+',

Adjunto su contrato de mantenimiento.

HAROSAT Ecotechnical
Tfno: 640 05 64 84
WA: 613 68 49 79');
  var url=tel?'https://wa.me/'+(tel.startsWith('+')?tel.slice(1):'34'+tel)+'?text='+msg:'https://wa.me/?text='+msg;
  window.open(url,'_blank'); toast('Abriendo WhatsApp...','ok');
}

async function compartir(){
  if(!pdfBlob){toast('Genera el PDF primero','err');return;}
  var file=new File([pdfBlob],pdfNombre,{type:'application/pdf'});
  try{await navigator.share({files:[file],title:'Contrato HAROSAT'});}
  catch(e){if(e.name!=='AbortError')toast('No se pudo compartir','err');}
}

var tt;
function toast(msg,t){
  var el=document.getElementById('toast'); el.textContent=msg; el.className='show '+(t||'');
  clearTimeout(tt); tt=setTimeout(function(){el.className='';},3000);
}

})();
