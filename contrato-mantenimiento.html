<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Contrato HAROSAT">
<title>Contrato Mantenimiento — HAROSAT</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#060910;--surface:#0d1117;--card:#111827;--border:#1f2937;--blue:#2563a8;--bl:#3B8AC7;--yellow:#FDB913;--text:#f0f4f8;--muted:#6b7280;--ok:#10b981;--err:#ef4444;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
header{background:var(--surface);border-bottom:2px solid var(--blue);padding:0 14px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;}
#logo-app{height:40px;width:auto;display:block;}
.hdr-title{font-size:12px;font-weight:600;color:var(--yellow);text-transform:uppercase;letter-spacing:.5px;}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:600;}
.bwarn{background:rgba(253,185,19,.15);color:var(--yellow);}
.bok{background:rgba(16,185,129,.15);color:var(--ok);}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor;}
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);}
.tab{flex:1;padding:11px 4px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:'Outfit',sans-serif;font-size:11px;font-weight:500;cursor:pointer;transition:.2s;white-space:nowrap;}
.tab.on{color:var(--bl);border-bottom-color:var(--bl);}
.sec{display:none;padding:14px;}
.sec.on{display:block;}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:11px;}
.ct{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:11px;display:flex;align-items:center;gap:7px;}
.ct::before{content:'';width:3px;height:11px;background:var(--bl);border-radius:2px;}
.f{margin-bottom:10px;}
.f label{display:block;font-size:10px;color:var(--muted);margin-bottom:3px;font-weight:500;}
.f input,.f select{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:9px 11px;color:var(--text);font-family:'Outfit',sans-serif;font-size:13px;outline:none;transition:.2s;}
.f input:focus,.f select:focus{border-color:var(--bl);}
.f select option{background:var(--card);}
.campo-calc{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:9px 11px;font-family:'Outfit',sans-serif;font-size:13px;min-height:40px;display:flex;align-items:center;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:7px;border:none;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:.2s;width:100%;margin-bottom:8px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.bblue{background:var(--blue);color:#fff;}
.byellow{background:var(--yellow);color:#111;}
.bghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
.bok2{background:var(--ok);color:#fff;}
.bwa{background:#25d366;color:#fff;}
.bgm{background:#ea4335;color:#fff;}
.bdl{background:#6366f1;color:#fff;}
.bsm{padding:7px 12px;font-size:11px;margin-bottom:0;}
.g2b{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.ir{display:flex;justify-content:space-between;font-size:11px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.ir span:first-child{color:var(--muted);}
.ir span:last-child{font-weight:500;}
.dv{height:1px;background:var(--border);margin:12px 0;}
#cvs{width:100%;height:170px;background:#fff;border-radius:7px;border:2px dashed var(--border);display:block;touch-action:none;cursor:crosshair;}
.so{display:flex;gap:7px;margin-bottom:12px;}
.sopt{flex:1;padding:9px;border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:6px;font-family:'Outfit',sans-serif;font-size:11px;font-weight:500;cursor:pointer;transition:.2s;}
.sopt.on{border-color:var(--bl);background:rgba(59,138,199,.1);color:var(--bl);}
.sc{display:flex;gap:7px;margin-top:8px;}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--card);border:1px solid var(--border);border-radius:7px;padding:10px 18px;font-size:12px;font-weight:500;z-index:9999;transition:.3s;white-space:nowrap;max-width:92vw;}
#toast.show{transform:translateX(-50%) translateY(0);}
#toast.ok{border-color:var(--ok);color:var(--ok);}
#toast.err{border-color:var(--err);color:var(--err);}
@keyframes sp{to{transform:rotate(360deg);}}
.spin{display:inline-block;animation:sp .7s linear infinite;}
</style>
</head>

<script>
// ── LOGOS ──
document.addEventListener('DOMContentLoaded', function() {
  var small = document.getElementById('d-logo-app').textContent.trim();
  document.getElementById('logo-app').src = 'data:image/png;base64,' + small;
  var icon = document.getElementById('d-logo-icon').textContent.trim();
  var l1=document.createElement('link'); l1.rel='apple-touch-icon'; l1.href='data:image/png;base64,'+icon; document.head.appendChild(l1);
  var l2=document.createElement('link'); l2.rel='icon'; l2.type='image/png'; l2.href='data:image/png;base64,'+icon; document.head.appendChild(l2);
});

// ── IVA ──
function calcIva(v) {
  var b = parseFloat((v||'').replace(',','.'));
  if (isNaN(b) || (v||'').trim()==='') {
    document.getElementById('i-iva').textContent = '—';
    document.getElementById('i-total').textContent = '—';
  } else {
    document.getElementById('i-iva').textContent = (b * 0.21).toFixed(2);
    document.getElementById('i-total').textContent = (b * 1.21).toFixed(2);
  }
}

// ── ESTADO ──
var firmaImg=null, firmaTs=null, pdfBlob=null, pdfNombre='contrato.pdf';
var cvsInited=false, cvs, ctx, drawing=false;
var cacheLogoPdf=null, cacheFirma=null, cacheSello=null, cachePub1=null, cachePub2=null;

// ── TABS ──
function goTab(id) {
  document.querySelectorAll('.sec').forEach(function(s){s.classList.remove('on');});
  document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('on');});
  document.getElementById('sec-'+id).classList.add('on');
  var tabs=['datos','firma','enviar'];
  for(var i=0;i<tabs.length;i++){if(tabs[i]===id){document.querySelectorAll('.tab')[i].classList.add('on');break;}}
  if(id==='firma'&&!cvsInited){setTimeout(initCvs,80);cvsInited=true;}
  if(id==='enviar') updResumen();
}

// ── HELPERS ──
function g(id,fb){var e=document.getElementById(id);return e&&e.value&&e.value.trim()?e.value.trim():(fb||'');}
function gd(id){var e=document.getElementById(id);return e?e.textContent.trim():'';}
function fmtD(iso){if(!iso)return'';return new Date(iso+'T00:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'});}

function loadImg(elId, cache, cb) {
  if (cache) { cb(cache); return; }
  var b64 = document.getElementById(elId).textContent.trim();
  var img = new Image();
  img.onload = function() {
    var c=document.createElement('canvas'); c.width=img.width; c.height=img.height;
    c.getContext('2d').drawImage(img,0,0);
    cb(c.toDataURL('image/jpeg'));
  };
  img.onerror = function(){ cb(null); };
  img.src = 'data:image/jpeg;base64,' + b64;
}

// ── CANVAS ──
function initCvs() {
  cvs=document.getElementById('cvs'); ctx=cvs.getContext('2d');
  var dpr=window.devicePixelRatio||1;
  cvs.width=cvs.offsetWidth*dpr; cvs.height=170*dpr; ctx.scale(dpr,dpr);
  ctx.strokeStyle='#1a1a2e'; ctx.lineWidth=2.5; ctx.lineCap='round'; ctx.lineJoin='round';
  cvs.addEventListener('touchstart',function(e){e.preventDefault();drawing=true;var r=cvs.getBoundingClientRect();ctx.beginPath();ctx.moveTo(e.touches[0].clientX-r.left,e.touches[0].clientY-r.top);},{passive:false});
  cvs.addEventListener('touchmove',function(e){e.preventDefault();if(!drawing)return;var r=cvs.getBoundingClientRect();ctx.lineTo(e.touches[0].clientX-r.left,e.touches[0].clientY-r.top);ctx.stroke();},{passive:false});
  cvs.addEventListener('touchend',function(){drawing=false;});
  cvs.addEventListener('mousedown',function(e){drawing=true;var r=cvs.getBoundingClientRect();ctx.beginPath();ctx.moveTo(e.clientX-r.left,e.clientY-r.top);});
  cvs.addEventListener('mousemove',function(e){if(!drawing)return;var r=cvs.getBoundingClientRect();ctx.lineTo(e.clientX-r.left,e.clientY-r.top);ctx.stroke();});
  cvs.addEventListener('mouseup',function(){drawing=false;});
  cvs.addEventListener('mouseleave',function(){drawing=false;});
}
function borrar(){if(ctx)ctx.clearRect(0,0,cvs.width,cvs.height);}

function aceptarManual(){
  if(!ctx){toast('Error en canvas','err');return;}
  var d=ctx.getImageData(0,0,cvs.width,cvs.height).data;
  var hay=false; for(var i=3;i<d.length;i+=4){if(d[i]>0){hay=true;break;}}
  if(!hay){toast('Firme en el recuadro primero','err');return;}
  var t=document.createElement('canvas'); t.width=cvs.width; t.height=cvs.height;
  var tc=t.getContext('2d'); tc.fillStyle='#fff'; tc.fillRect(0,0,t.width,t.height); tc.drawImage(cvs,0,0);
  firmaImg=t.toDataURL('image/png'); firmaTs=new Date().toLocaleString('es-ES'); mostrarFirmada();
}
function aceptarAuto(){
  var nombre=g('u-nombre'); if(!nombre){toast('Introduce el nombre primero','err');return;}
  var c=document.getElementById('cvs-auto'); var dpr=window.devicePixelRatio||1;
  c.width=c.offsetWidth*dpr; c.height=110*dpr;
  var cx=c.getContext('2d'); cx.scale(dpr,dpr); var W=c.offsetWidth;
  cx.fillStyle='#fff'; cx.fillRect(0,0,W,110);
  cx.font='italic 300 36px Georgia,serif'; cx.fillStyle='#1a2a4a'; cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText(nombre,W/2,44);
  cx.strokeStyle='#bbb'; cx.lineWidth=1; cx.beginPath(); cx.moveTo(W*0.08,72); cx.lineTo(W*0.92,72); cx.stroke();
  firmaTs=new Date().toLocaleString('es-ES');
  cx.font='9px monospace'; cx.fillStyle='#999'; cx.fillText(firmaTs,W/2,88);
  firmaImg=c.toDataURL('image/png'); mostrarFirmada();
}
function mostrarFirmada(){
  document.getElementById('card-ok').style.display='';
  document.getElementById('prev-firma').src=firmaImg;
  document.getElementById('ts-firma').textContent='Firmado: '+firmaTs;
  document.getElementById('badge').className='badge bok';
  document.getElementById('badge').innerHTML='<span class="dot"></span>Firmado';
  pdfBlob=null; document.getElementById('card-envio').style.display='none';
  toast('Firma guardada','ok');
}
function rehacer(){
  firmaImg=null; firmaTs=null; pdfBlob=null;
  document.getElementById('card-ok').style.display='none';
  document.getElementById('card-envio').style.display='none';
  document.getElementById('badge').className='badge bwarn';
  document.getElementById('badge').innerHTML='<span class="dot"></span>Borrador';
  if(ctx) ctx.clearRect(0,0,cvs.width,cvs.height);
}
function mFirma(m){
  document.getElementById('sm').classList.toggle('on',m==='manual');
  document.getElementById('sa').classList.toggle('on',m==='auto');
  document.getElementById('wm').style.display=m==='manual'?'':'none';
  document.getElementById('wa').style.display=m==='auto'?'':'none';
}

// ── RESUMEN ──
function b2(t,l){return'<span class="badge '+(t==='ok'?'bok':'bwarn')+'"><span class="dot"></span>'+l+'</span>';}
function updResumen(){
  var n=g('u-nombre','-'),nc=g('d-nc','-'),tp=g('d-tipo','-');
  var tot=gd('i-total'); if(!tot||tot==='—')tot='-';
  document.getElementById('resumen').innerHTML=
    '<div class="ir"><span>Contrato</span><span>'+nc+'</span></div>'+
    '<div class="ir"><span>Cliente</span><span>'+n+'</span></div>'+
    '<div class="ir"><span>Equipo</span><span>'+tp+'</span></div>'+
    '<div class="ir"><span>Total</span><span>'+(tot!='-'?tot+' EUR':'-')+'</span></div>';
  document.getElementById('st-d').innerHTML=(g('u-nombre')&&g('d-nc'))?b2('ok','OK'):b2('warn','Incompleto');
  document.getElementById('st-f').innerHTML=firmaImg?b2('ok','Firmado'):b2('warn','Pendiente');
  if(navigator.share) document.getElementById('btn-share').style.display='';
}

// ── PDF ──
function genPDF(){
  var btn=document.getElementById('btn-pdf'),info=document.getElementById('pdf-info');
  btn.disabled=true; btn.innerHTML='<span class="spin">...</span> Generando';
  info.style.display='block'; info.textContent='Cargando imagenes...';
  // Cargar todas las imágenes en paralelo
  var loaded=0; var total=4;
  function check(){loaded++;if(loaded===total) buildPDF(btn,info);}
  loadImg('d-logo-pdf',cacheLogoPdf,function(i){cacheLogoPdf=i;check();});
  loadImg('d-firma',cacheFirma,function(i){cacheFirma=i;check();});
  loadImg('d-sello',cacheSello,function(i){cacheSello=i;check();});
  loadImg('d-pub1',cachePub1,function(i){cachePub1=i;check();});
}

function buildPDF(btn,info){
  try{
    var jsPDF=window.jspdf.jsPDF;
    var doc=new jsPDF({unit:'mm',format:'a4'});
    var W=210,H=297,M=12,TW=186;
    var nc=g('d-nc','____________');
    var vigor=fmtD(document.getElementById('d-vigor').value)||'__/__/____';
    var tipo=g('d-tipo','________________________');

    var base=g('i-base','');
    var iva=gd('i-iva'); if(iva==='—')iva='';
    var total=gd('i-total'); if(total==='—')total='';
    var hoy=new Date();
    var dia=hoy.getDate().toString();

    function T(txt,x,y,mw){doc.setFont('helvetica','normal');doc.setFontSize(7.5);var ls=doc.splitTextToSize(txt,mw);doc.text(ls,x,y);return ls.length*3.8+1;}

    B('N. Cta.:',c1x,cy+10); doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.text(iban,c1x+18,cy+10);
    var ix=138;
    B('Base Imponible:',ix,cy+2); B('Importe IVA 21%:',ix,cy+8); B('Total ...:',ix,cy+14);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
    if(base) doc.text(base+' EUR',W-M,cy+2,{align:'right'});
    if(iva)  doc.text(iva+' EUR',W-M,cy+8,{align:'right'});
    if(total)doc.text(total+' EUR',W-M,cy+14,{align:'right'});
    cy+=20;

    doc.setLineWidth(0.3); doc.line(M,cy-1,W-M,cy-1);
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.text('CONTRATO DE MANTENIMIENTO DE INSTALACION TERMICA',M,cy+4); cy+=9;

    var clausulas1=[
      '1. El contrato tiene un ano de duracion, renovable automatica e indefinidamente por plazos anuales, salvo renuncia de alguna de las partes contratantes, en cuyo caso se debera comunicar a la empresa.',
      '2. La empresa mantenedora, durante su horario de jornada laboral, se compromete a realizar una revision preventiva anual obligatoria de los aparatos descritos en este contrato.',
      '3. En la revision preventiva anual se incluyen los gastos por mano de obra y desplazamiento.',
      '4. Sera por cuenta del usuario el valor de las piezas averiadas sustituidas.',
      '5. Quedan expresamente excluidas: averias por fuerza mayor (inundacion, congelacion, revocos, incendios, aguas duras o alcalinas), maquinas y componentes conectados al aparato, averias por falta de combustible, y reparaciones fuera del horario laboral.',
      '6. Los aparatos estaran accesibles para su mantenimiento. En caso contrario los costes de desmontaje o retirada de muebles u otros objetos correran a cargo del cliente.',
      '7. Este contrato quedara automaticamente rescindido si el aparato fuera manipulado por personal ajeno a la empresa mantenedora.',
      '8. En ningun caso la rescision por parte del usuario dara derecho a devolucion de importe alguno. Si la rescision fuera por parte de la empresa, devolvera la parte proporcional de la ultima cuota satisfecha.',
      '9. La empresa mantenedora declara estar al corriente del pago de seguros sociales y exime al usuario de toda responsabilidad por accidente.',
      '10. El importe anual de este contrato es de ['+(total||'___')+'] euros + IVA, revisable anualmente. Debera ser satisfecho en una sola vez al momento de la firma, en metalico o mediante domiciliacion bancaria.',
    ];
    for(var i=0;i<clausulas1.length;i++){if(cy>200)break;cy+=T('- '+clausulas1[i],M,cy,TW);}

    // IMAGEN PUBLICIDAD pagina 1 — ocupa espacio libre hasta el pie
    var espacio1 = 278 - cy; // hasta el pie de pagina
    if(espacio1 > 20 && cachePub1){
      try{
        // imagen folleto: ratio 1536/1024 = 1.5 (landscape)
        var imgH = Math.min(espacio1 - 4, 70);
        var imgW = Math.min(TW, imgH * 1.5);
        var imgX = M + (TW - imgW) / 2;
        doc.addImage(cachePub1,'JPEG',imgX,cy+2,imgW,imgH);
      }catch(e){}
    }
    drawPie(doc);

    // ══ PAGINA 2 ══
    doc.addPage();
    cy=drawCab(doc,'2')+2;

    var clausulas2=[
      '11. El pago debera ser abonado dentro del primer mes de la entrada en vigor o de sus prorrogas, reservandose la empresa mantenedora el derecho a prestar servicio si el importe no ha sido satisfecho.',
      '12. Este contrato no acredita por si solo que el pago haya sido satisfecho; se debera presentar el recibo bancario o resguardo de cobro en efectivo.',
      '13. Al hacerse cargo del mantenimiento, el titular entregara copia de: proyecto o memoria tecnica; certificado de la instalacion; certificado de inspeccion inicial con calificacion aceptable, cuando sea preceptivo.',
      '14. El titular es responsable del cumplimiento del RITE desde la recepcion provisional, de acuerdo con la Ley 21/1992 de Industria.',
      '15. Ambas partes se someten a los Tribunales de Justicia de la provincia del domicilio fiscal de la empresa mantenedora para cualquier cuestion derivada de este contrato.',
      '16. Los firmantes declaran que los datos son ciertos y otorgan consentimiento expreso para ser tratados automatizadamente, a fin de facilitar una mejor gestion en la prestacion de los servicios.',
      '17. De conformidad con la Ley Organica 15/1999 de Proteccion de Datos, los datos seran tratados para contactar con el usuario. El usuario podra ejercitar sus derechos dirigiendose a harosatecnicos@gmail.com',
      '18. La atencion se realizara de lunes a viernes, de 8:00 a 15:00, siempre con cita previa y por orden de llamada.',
    ];
    for(var j=0;j<clausulas2.length;j++){cy+=T('- '+clausulas2[j],M,cy,TW);}

    cy+=4;
    doc.setFont('helvetica','normal'); doc.setFontSize(8);
    var cl=doc.splitTextToSize('Y en prueba de conformidad y a su mas exacto cumplimiento ambas partes firman por duplicado el presente contrato en',TW);
    doc.text(cl,M,cy); cy+=cl.length*4+4;

    // IMAGEN PUBLICIDAD pagina 2 — entre texto y firmas
    var espacio2 = 215 - cy;
    if(espacio2 > 20 && cachePub1){
      try{
        var imgH2 = Math.min(espacio2 - 4, 55);
        var imgW2 = Math.min(TW, imgH2 * 1.5);
        var imgX2 = M + (TW - imgW2) / 2;
        doc.addImage(cachePub1,'JPEG',imgX2,cy,imgW2,imgH2);
        cy += imgH2 + 4;
      }catch(e){}
    }

    // ── BLOQUE FIRMAS ──
    cy = Math.max(cy, 215);

    // Encabezados firma
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(10,10,10);
    doc.text('USUARIO/A',M+22,cy,{align:'center'});
    doc.text('Por la Empresa Mantenedora',W-M-32,cy,{align:'center'});
    cy+=6;

    // Fecha
    doc.setFont('helvetica','bold'); doc.setFontSize(8);
    doc.text('Haro a',M+2,cy);
    doc.setFont('helvetica','normal');
    doc.text(dia,M+18,cy); doc.text('de',M+26,cy); doc.text(mes,M+32,cy); doc.text('de',M+52,cy); doc.text(anio,M+58,cy);
    cy+=6;

    // Firma cliente
    if(firmaImg){
      try{doc.addImage(firmaImg,'PNG',M+2,cy,55,20);}catch(e){}
    }
    doc.setLineWidth(0.3); doc.line(M+2,cy+22,M+68,cy+22);
    doc.setFont('helvetica','italic'); doc.setFontSize(7.5);
    doc.text('(Firma del Cliente)',M+2,cy+27);

    // Firma empresa (derecha)
    var ex = W-M-75;
    // Firma manuscrita
    if(cacheFirma){
      try{doc.addImage(cacheFirma,'JPEG',ex,cy,40,20);}catch(e){}
    }
    // Sello
    if(cacheSello){
      try{doc.addImage(cacheSello,'JPEG',ex+42,cy+2,30,15);}catch(e){}
    }
    doc.setLineWidth(0.3); doc.line(ex,cy+22,ex+75,cy+22);
    doc.setFont('helvetica','italic'); doc.setFontSize(7.5);
    doc.text('Jesus Garzon Martin — HAROSAT ECOTECHNICAL',ex,cy+27);

    drawPie(doc);

    pdfNombre='CM_'+nc.replace(/\//g,'-')+'_'+(nombre.split(' ')[0]||'cliente')+'.pdf';
    pdfBlob=doc.output('blob');
    document.getElementById('card-envio').style.display='';
    btn.disabled=false; btn.innerHTML='PDF generado';
    info.textContent='Listo: '+pdfNombre;
    if(navigator.share) document.getElementById('btn-share').style.display='';
    toast('PDF generado correctamente','ok');
  }catch(err){
    btn.disabled=false; btn.innerHTML='Generar PDF del contrato';
    info.textContent='Error: '+err.message;
    toast('Error al generar PDF','err'); console.error(err);
  }
}

// ── DESCARGAR / ENVIAR ──
function descargar(){
  if(!pdfBlob){toast('Genera el PDF primero','err');return;}
  var url=URL.createObjectURL(pdfBlob);
  var a=document.createElement('a'); a.href=url; a.download=pdfNombre;
  document.body.appendChild(a); a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},1000);
  toast('Descargando...','ok');
}
function envWA(){
  var tel=g('u-tel').replace(/\s/g,''),nc=g('d-nc','contrato'),nom=g('u-nombre','cliente');
  if(pdfBlob&&navigator.share&&navigator.canShare){
    var f=new File([pdfBlob],pdfNombre,{type:'application/pdf'});
    if(navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Contrato HAROSAT '+nc});return;}
  }
  var msg=encodeURIComponent('Contrato Mantenimiento HAROSAT
Ref: '+nc+'

Estimado/a '+nom+',
adjunto su contrato.

HAROSAT Ecotechnical
Tfno: 640 05 64 84');
  var url=tel?'https://wa.me/'+(tel.startsWith('+')?tel.slice(1):'34'+tel)+'?text='+msg:'https://wa.me/?text='+msg;
  window.open(url,'_blank'); toast('Abriendo WhatsApp...','ok');
}
function envGmail(){
  var email=g('u-email'),nc=g('d-nc','contrato'),nom=g('u-nombre','cliente');
  var a=encodeURIComponent('Contrato Mantenimiento HAROSAT - Ref. '+nc);
  var b=encodeURIComponent('Estimado/a '+nom+',

Adjunto contrato ref. '+nc+'.

HAROSAT Ecotechnical
Tfno: 640 05 64 84
harosatecnicos@gmail.com');
  window.location.href=(email?'mailto:'+email:'mailto:')+'?subject='+a+'&body='+b;
  toast('Abriendo correo...','ok');
}
async function compartir(){
  if(!pdfBlob){toast('Genera el PDF primero','err');return;}
  var f=new File([pdfBlob],pdfNombre,{type:'application/pdf'});
  try{await navigator.share({files:[f],title:'Contrato HAROSAT'});}
  catch(e){if(e.name!=='AbortError')toast('No se pudo compartir','err');}
}
var tt;
function toast(msg,t){
  var el=document.getElementById('toast'); el.textContent=msg; el.className='show '+(t||'');
  clearTimeout(tt); tt=setTimeout(function(){el.className='';},3000);
}

// ── INIT ──
(function(){
  var yr=new Date().getFullYear().toString().slice(-2);
  document.getElementById('d-nc').value='CM/'+yr+'/001';
  document.getElementById('d-vigor').value=new Date().toISOString().slice(0,10);
})();
</script>
