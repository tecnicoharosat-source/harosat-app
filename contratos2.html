<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#0a1628;--bg3:#112240;--card:#0f2040;--card2:#162a50;--border:#1e3a5f;--blue:#1a6fbf;--blue2:#2a8fd4;--blue3:#3daee9;--yellow:#FDB913;--green:#3dba6e;--red:#e84545;--text:#eae6d8;--text2:#b8c8dc;--text3:#7a9ab8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;}
.header{background:#071020;border-bottom:2px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.hl{display:flex;align-items:center;gap:12px;}
.logo{width:44px;height:44px;border-radius:10px;object-fit:contain;}
.brand{font-size:17px;font-weight:800;letter-spacing:1px;}.brand span{color:var(--yellow);}
.brand-sub{font-size:10px;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;}
.sep{width:1px;height:34px;background:var(--border);margin:0 8px;}
.app-title{font-size:19px;font-weight:700;color:var(--text2);}
.hr-info{display:flex;align-items:center;gap:16px;font-size:12px;color:var(--text3);flex-wrap:wrap;}
.main{max-width:1200px;margin:0 auto;padding:22px 24px;}
.toolbar{display:flex;gap:10px;margin-bottom:18px;}
.btn{padding:10px 16px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-family:'Outfit',sans-serif;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:all .15s;}
.btn:hover{background:var(--card2);color:var(--text);}
.btn-p{background:linear-gradient(135deg,#1a6fbf,#2a8fd4);border-color:#2a8fd4;color:#fff;font-weight:700;}
.btn-g{background:linear-gradient(135deg,#2a9d5c,#3dba6e);border-color:#3dba6e;color:#fff;font-weight:700;}
.btn-r{background:#d93025;border-color:#d93025;color:#fff;font-weight:700;}
.tw{background:var(--card);border:1px solid var(--border);border-radius:13px;overflow:auto;}
table{width:100%;border-collapse:collapse;min-width:600px;}
thead tr{border-bottom:2px solid var(--border);background:var(--bg3);}
thead th{padding:12px 15px;text-align:left;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;white-space:nowrap;}
tbody tr{border-bottom:1px solid rgba(30,58,95,.5);transition:background .1s;cursor:pointer;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:var(--card2);}
tbody td{padding:12px 15px;font-size:13px;color:var(--text);white-space:nowrap;}
.msg{padding:60px;text-align:center;color:var(--text3);font-size:14px;}
.bf{background:rgba(61,186,110,.15);color:#4dd47e;border:1px solid rgba(61,186,110,.35);display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.bn{background:rgba(249,115,22,.15);color:#fb923c;border:1px solid rgba(249,115,22,.35);display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.acts{display:flex;gap:5px;}
.ab{background:none;border:none;cursor:pointer;color:var(--text3);padding:5px;border-radius:7px;display:flex;align-items:center;transition:all .15s;}
.ab:hover{color:var(--blue3);background:rgba(42,143,212,.15);}
.ab.del:hover{color:var(--red);background:rgba(232,69,69,.15);}
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;align-items:center;justify-content:center;padding:20px;overflow-y:auto;}
.mo.active{display:flex;}
.modal{background:var(--bg3);border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
.mt{font-size:18px;font-weight:700;}
.mc{background:none;border:none;color:var(--text3);cursor:pointer;font-size:20px;padding:4px 8px;border-radius:8px;}
.stit{font-size:11px;font-weight:700;color:var(--blue3);text-transform:uppercase;letter-spacing:1px;margin:18px 0 12px;border-bottom:1px solid var(--border);padding-bottom:6px;}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.ff{grid-column:1/-1;}
.fv{display:flex;flex-direction:column;gap:6px;}
.fl{font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.5px;text-transform:uppercase;}
.r{color:var(--blue3);}
.fi{background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;color:var(--text);font-family:'Outfit',sans-serif;font-size:14px;width:100%;}
.fi:focus{outline:none;border-color:var(--blue2);}
.fi::placeholder{color:var(--text3);}
.mf{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid var(--border);}
.ftabs{display:flex;gap:10px;margin-bottom:12px;}
.ftab{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text3);cursor:pointer;font-size:13px;font-family:'Outfit',sans-serif;}
.ftab.active{background:var(--blue);border-color:var(--blue);color:#fff;}
#fpad{border:2px solid var(--border);border-radius:10px;background:#fff;display:block;width:100%;touch-action:none;}
.mo-c{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:2000;overflow-y:auto;padding:20px;}
.mo-c.active{display:block;}
.cw{background:#fff;border-radius:12px;width:100%;max-width:800px;margin:0 auto;overflow:hidden;}
.cbar{background:var(--bg3);padding:14px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--border);}
.cbar-t{font-size:14px;font-weight:600;color:var(--text);flex:1;}
#pdf-c{padding:32px;font-family:'Outfit',sans-serif;color:#1a1a2e;background:#fff;font-size:11px;line-height:1.5;}
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;padding-bottom:12px;border-bottom:2px solid #1a6fbf;}
.pco{font-size:15px;font-weight:800;color:#1a6fbf;}.pco span{color:#FDB913;}
.pcs{font-size:10px;color:#666;margin-top:2px;}
.pr{text-align:right;}
.pr-t{font-size:11px;font-weight:700;color:#1a6fbf;text-transform:uppercase;}
.pr-n{font-size:18px;font-weight:800;color:#1a1a2e;margin-top:3px;}
.pr-d{font-size:10px;color:#666;}
.ptit{text-align:center;margin:14px 0;}
.ptit h2{font-size:12px;font-weight:700;color:#1a6fbf;text-transform:uppercase;letter-spacing:1px;}
.ptit p{font-size:10px;color:#888;}
.ppar{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.pp{background:#f0f6ff;border:1px solid #d0e4f7;border-radius:8px;padding:12px;}
.pp-t{font-size:9px;font-weight:700;color:#1a6fbf;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.peq{background:#fff8e6;border:1px solid #ffd97a;border-radius:8px;padding:12px;margin-bottom:14px;}
.peq-t{font-size:9px;font-weight:700;color:#c8860a;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
.peg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.peg div label{font-size:9px;color:#888;display:block;}
.peg div span{font-size:11px;font-weight:600;color:#1a1a2e;}
.pimp{float:right;background:#f0f6ff;border:1px solid #d0e4f7;border-radius:8px;padding:12px;width:210px;margin-bottom:14px;}
.pimp-t{font-size:9px;font-weight:700;color:#1a6fbf;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
.pimp-r{display:flex;justify-content:space-between;font-size:11px;color:#555;margin-bottom:3px;}
.pimp-tot{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:#1a6fbf;margin-top:6px;padding-top:6px;border-top:2px solid #1a6fbf;}
.pcl{clear:both;}
.pcl h3{font-size:11px;font-weight:700;margin-bottom:10px;text-transform:uppercase;}
.pcl p{font-size:9px;color:#444;margin-bottom:6px;text-align:justify;}
.paviso{background:#fff8e6;border:1px solid #ffd97a;border-radius:6px;padding:8px;text-align:center;margin:14px 0;font-size:10px;font-weight:600;color:#c8860a;}
.pfir{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:14px;}
.pfir-b{text-align:center;}
.pfir-l{font-size:9px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.pfir-a{border:1px solid #ddd;border-radius:8px;height:85px;display:flex;align-items:center;justify-content:center;background:#fafafa;overflow:hidden;}
.pfir-a img{max-width:100%;max-height:80px;object-fit:contain;}
.pfir-n{font-size:10px;color:#444;margin-top:4px;}
.ppie{margin-top:14px;padding-top:10px;border-top:1px solid #eee;font-size:9px;color:#aaa;display:flex;justify-content:space-between;}
.toast{position:fixed;bottom:24px;right:24px;background:var(--card2);border:1px solid var(--border);border-radius:11px;padding:13px 20px;font-size:13px;font-weight:500;color:var(--text);z-index:9999;opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.success{border-color:var(--green);color:#4dd47e;}
.toast.error{border-color:var(--red);color:#f06060;}
</style>

function abrirForm(){
clearPad();
[‘fn’,‘fnif’,‘fdir’,‘ftel’,‘ftipo’,‘fmarca’,‘fmodelo’,‘fserie’,‘fbase’,‘ftotal’].forEach(function(id){document.getElementById(id).value=’’;});
document.getElementById(‘ffecha’).value=new Date().toISOString().split(‘T’)[0];
setFirma(‘pad’);
document.getElementById(‘mo-form’).classList.add(‘active’);
}
function cerrarForm(){document.getElementById(‘mo-form’).classList.remove(‘active’);}
function cerrarCont(){document.getElementById(‘mo-c’).classList.remove(‘active’);}

function getFirma(){
if(fMode===‘pad’){
var blank=document.createElement(‘canvas’);blank.width=pad.width;blank.height=pad.height;
if(pad.toDataURL()===blank.toDataURL())return null;
return pad.toDataURL(‘image/png’);
}
var n=document.getElementById(‘fn’).value.trim()||‘Firma’;
var c=document.createElement(‘canvas’);c.width=400;c.height=100;
var cx=c.getContext(‘2d’);cx.fillStyle=’#fff’;cx.fillRect(0,0,400,100);
cx.font=‘italic 300 38px Outfit,sans-serif’;cx.fillStyle=’#1a1a2e’;cx.textAlign=‘center’;cx.textBaseline=‘middle’;
cx.fillText(n,200,50);return c.toDataURL(‘image/png’);
}

async function guardar(){
var nombre=document.getElementById(‘fn’).value.trim();
var base=parseFloat(document.getElementById(‘fbase’).value);
var fecha=document.getElementById(‘ffecha’).value;
if(!nombre||!base||!fecha){toast(‘Completa los campos obligatorios’,‘error’);return;}
var firma=getFirma();
var p={fecha_vigencia:fecha,cliente_nombre:nombre,cliente_nif:document.getElementById(‘fnif’).value.trim()||null,cliente_direccion:document.getElementById(‘fdir’).value.trim()||null,cliente_telefono:document.getElementById(‘ftel’).value.trim()||null,equipo_tipo:document.getElementById(‘ftipo’).value.trim()||null,equipo_marca:document.getElementById(‘fmarca’).value.trim()||null,equipo_modelo:document.getElementById(‘fmodelo’).value.trim()||null,equipo_serie:document.getElementById(‘fserie’).value.trim()||null,base_imponible:base,firma_cliente:firma,firma_auto:fMode===‘auto’};
var res=await sb.from(‘contratos’).insert(p).select().single();
if(res.error){toast(’Error: ’+res.error.message,‘error’);return;}
toast(‘Contrato guardado’,‘success’);
cerrarForm();await cargar();verContrato(res.data.id);
}

async function eliminar(id){
if(!confirm(’¿Eliminar este contrato?’))return;
await sb.from(‘contratos’).delete().eq(‘id’,id);
toast(‘Eliminado’,‘success’);await cargar();
}

function verContrato(id){
var r=allData.find(function(x){return x.id===id;});
if(!r)return;
cActual=r;
document.getElementById(‘ctitle’).textContent=‘Contrato ‘+r.numero+’ — ‘+(r.cliente_nombre||’’);
document.getElementById(‘pdf-c’).outerHTML=htmlContrato(r);
document.getElementById(‘mo-c’).classList.add(‘active’);
}

if(!cActual)return;
