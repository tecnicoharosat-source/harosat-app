@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
button{font-family:'Inter',sans-serif;-webkit-text-fill-color:inherit}
html,body{background:#0f1923 !important;color:#e8f0f7;font-family:'Inter',sans-serif;min-height:100vh}
header{background:#162130;border-bottom:2px solid #3B8AC7;padding:0 18px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 14px rgba(59,138,199,.2)}
.hl{display:flex;align-items:center;gap:11px}
.logo{width:42px;height:42px;border-radius:9px;overflow:hidden;flex-shrink:0}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.ht{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;color:#e8f0f7;letter-spacing:1px}
.ht span{color:#FDB913}
.hs{font-size:10px;color:#5a7a94;text-transform:uppercase;letter-spacing:2px;margin-top:1px}
#cs{display:flex;align-items:center;gap:6px;font-size:11px;color:#8aaec8;background:#0f1923;border:1px solid #2d4a62;border-radius:20px;padding:4px 11px}
#cd{width:7px;height:7px;border-radius:50%;background:#5a7a94;transition:background .3s}
#cd.ok{background:#5A9F3E;box-shadow:0 0 6px #5A9F3E}
#cd.err{background:#e05252}
.wrap{max-width:1400px;margin:0 auto;padding:20px 16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:20px}
@media(max-width:750px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:#1a2d3e;border:1px solid #2d4a62;border-radius:12px;padding:15px 16px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:12px 12px 0 0}
.kb::before{background:#3B8AC7}.kg::before{background:#5A9F3E}.ky::before{background:#FDB913}.kr::before{background:#e05252}
.kl{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:#5a7a94;margin-bottom:5px}
.kv{font-family:'Rajdhani',sans-serif;font-size:30px;font-weight:700;color:#e8f0f7}
.ki{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:26px;opacity:.12}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.sw{flex:1;min-width:180px;position:relative}
.sw input{width:100%;background:#1e2f40;border:1px solid #2d4a62;color:#e8f0f7;-webkit-text-fill-color:#e8f0f7;padding:9px 12px 9px 34px;border-radius:9px;font-size:13px;font-family:'Inter',sans-serif;outline:none}
.sw input:focus{border-color:#3B8AC7}
.sw input::placeholder{color:#5a7a94;-webkit-text-fill-color:#5a7a94}
.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#5a7a94;font-size:14px;pointer-events:none}
select.fs{background:#1e2f40;border:1px solid #2d4a62;color:#e8f0f7;-webkit-text-fill-color:#e8f0f7;padding:9px 12px;border-radius:9px;font-size:13px;font-family:'Inter',sans-serif;outline:none;cursor:pointer;min-width:168px;-webkit-appearance:auto}
select.fs:focus{border-color:#3B8AC7}
select.fs option{background:#1e2f40;color:#e8f0f7}
.btn{padding:9px 15px;border-radius:9px;border:none;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:opacity .2s,transform .15s}
.btn:hover{opacity:.85;transform:translateY(-1px)}
.bn{background:#FDB913;color:#1a1a1a;-webkit-text-fill-color:#1a1a1a}
.bc{background:#1e2f40;color:#8aaec8;-webkit-text-fill-color:#8aaec8;border:1px solid #2d4a62}
.bp{background:#3B8AC7;color:#ffffff;-webkit-text-fill-color:#ffffff}
.bgr{background:#1e2f40;color:#8aaec8;-webkit-text-fill-color:#8aaec8;border:1px solid #2d4a62}
.bsm{padding:5px 10px;font-size:12px;border-radius:7px}
.be{background:rgba(59,138,199,.18);color:#5aa3d8;-webkit-text-fill-color:#5aa3d8;border:1px solid rgba(59,138,199,.3)}
.bd{background:rgba(224,82,82,.15);color:#e05252;-webkit-text-fill-color:#e05252;border:1px solid rgba(224,82,82,.3)}
.tw{background:#1a2d3e;border:1px solid #2d4a62;border-radius:13px;overflow:hidden}
.th2{background:#1e2f40;border-bottom:1px solid #2d4a62;padding:13px 16px;display:flex;align-items:center;justify-content:space-between}
.tt{font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;color:#e8f0f7}
.tc{font-size:11px;color:#8aaec8;background:#243647;border:1px solid #2d4a62;border-radius:20px;padding:3px 10px}
.ts{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:#1e2f40;padding:9px 13px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:#8aaec8;font-weight:600;border-bottom:1px solid #2d4a62;white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:#5aa3d8}
tbody tr{border-bottom:1px solid rgba(45,74,98,.45)}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:rgba(59,138,199,.06)}
td{padding:10px 13px;color:#8aaec8;vertical-align:middle}
td.tref{font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:700;color:#5aa3d8;white-space:nowrap}
td.tdesc{color:#e8f0f7;font-weight:500}
.cb{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500;background:rgba(59,138,199,.15);color:#5aa3d8;border:1px solid rgba(59,138,199,.25);white-space:nowrap}
.qw{display:flex;align-items:center;gap:6px}
.qn{font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700}
.qn.ok{color:#5A9F3E}.qn.warn{color:#FDB913}.qn.danger{color:#e05252}
.sb{width:44px;height:4px;background:#243647;border-radius:2px;overflow:hidden}
.sf{height:100%;border-radius:2px}
.sf.ok{background:#5A9F3E}.sf.warn{background:#FDB913}.sf.danger{background:#e05252}
.alb{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600;background:rgba(224,82,82,.15);color:#e05252;border:1px solid rgba(224,82,82,.3);animation:pls 1.6s infinite}
@keyframes pls{0%,100%{opacity:1}50%{opacity:.5}}
td.tprc{font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;color:#FDB913}
.aw{display:flex;gap:5px;justify-content:flex-end}
.empty{text-align:center;padding:55px 20px;color:#5a7a94;font-size:13px}
.eico{font-size:40px;opacity:.3;margin-bottom:9px}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:55px;color:#5a7a94;font-size:13px}
.spin{width:20px;height:20px;border:2px solid #2d4a62;border-top-color:#3B8AC7;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.73);z-index:200;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(3px)}
.ov.open{display:flex}
.modal{background:#162130;border:1px solid #2d4a62;border-radius:15px;width:100%;max-width:530px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:up .22s ease}
.msm{max-width:330px}
@keyframes up{from{transform:translateY(22px);opacity:0}to{transform:translateY(0);opacity:1}}
.mhd{padding:18px 20px 14px;border-bottom:1px solid #2d4a62;display:flex;align-items:center;justify-content:space-between}
.mtit{font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700;color:#e8f0f7;display:flex;align-items:center;gap:8px}
.mcls{width:28px;height:28px;border-radius:7px;background:#1e2f40;border:1px solid #2d4a62;color:#8aaec8;-webkit-text-fill-color:#8aaec8;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:background .2s}
.mcls:hover{background:#e05252;color:#fff;-webkit-text-fill-color:#fff;border-color:#e05252}
.mbody{padding:18px 20px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fi{display:flex;flex-direction:column;gap:5px}
.fi.full{grid-column:1/-1}
.fi label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#5a7a94;font-weight:600}
.fi input,.fi select{background:#1e2f40;border:1px solid #2d4a62;color:#e8f0f7;-webkit-text-fill-color:#e8f0f7;padding:9px 11px;border-radius:8px;font-size:13px;font-family:'Inter',sans-serif;outline:none;width:100%}
.fi input:focus,.fi select:focus{border-color:#3B8AC7}
.fi input::placeholder{color:#5a7a94;-webkit-text-fill-color:#5a7a94}
.fi select option{background:#1e2f40;color:#e8f0f7}
.mft{padding:13px 20px 18px;border-top:1px solid #2d4a62;display:flex;gap:8px;justify-content:flex-end}
.arow{display:flex;align-items:center;justify-content:center;gap:16px;margin:16px 0}
.abtn{width:44px;height:44px;border-radius:10px;border:none;font-size:22px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.abtn.m{background:rgba(224,82,82,.2);color:#e05252;-webkit-text-fill-color:#e05252;border:1px solid rgba(224,82,82,.3)}
.abtn.m:hover{background:#e05252;color:#fff;-webkit-text-fill-color:#fff}
.abtn.p{background:rgba(90,159,62,.2);color:#5A9F3E;-webkit-text-fill-color:#5A9F3E;border:1px solid rgba(90,159,62,.3)}
.abtn.p:hover{background:#5A9F3E;color:#fff;-webkit-text-fill-color:#fff}
.anum{font-family:'Rajdhani',sans-serif;font-size:50px;font-weight:700;color:#e8f0f7;min-width:76px;text-align:center;line-height:1}
.clist{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:13px}
.ctag{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;background:#1e2f40;border:1px solid #2d4a62;font-size:12px;color:#8aaec8}
.cx{cursor:pointer;color:#5a7a94;font-size:13px;line-height:1;transition:color .2s}
.cx:hover{color:#e05252}
.car{display:flex;gap:8px}
.car input{flex:1;background:#1e2f40;border:1px solid #2d4a62;color:#e8f0f7;-webkit-text-fill-color:#e8f0f7;padding:9px 11px;border-radius:8px;font-size:13px;font-family:'Inter',sans-serif;outline:none}
.car input:focus{border-color:#3B8AC7}
.car input::placeholder{color:#5a7a94;-webkit-text-fill-color:#5a7a94}
#notif{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.ntf{padding:10px 15px;border-radius:9px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:7px;box-shadow:0 4px 18px rgba(0,0,0,.4);pointer-events:all;animation:nfx .25s ease}
@keyframes nfx{from{transform:translateX(28px);opacity:0}to{transform:translateX(0);opacity:1}}
.ntf.ok{background:rgba(90,159,62,.95);color:#fff;-webkit-text-fill-color:#fff;border:1px solid #5A9F3E}
.ntf.err{background:rgba(224,82,82,.95);color:#fff;-webkit-text-fill-color:#fff;border:1px solid #e05252}
.ntf.info{background:rgba(59,138,199,.95);color:#fff;-webkit-text-fill-color:#fff;border:1px solid #3B8AC7}
@media(max-width:560px){.fgrid{grid-template-columns:1fr}}
</style>

    <div class="mhd">
      <div class="mtit"><span id="m-ico">＋</span><span id="m-tit">Nuevo artículo</span></div>
      <button class="mcls" onclick="closeModal()">✕</button>
    </div>
    <div class="mbody">
      <div class="fgrid">
        <div class="fi full" id="cat-search-wrap">
          <label>Buscar en catálogo (opcional)</label>
          <div style="position:relative">
            <input type="text" id="cat-search" placeholder="Escribe nombre o referencia para buscar…" oninput="searchCatalog()" autocomplete="off">
            <div id="cat-results" style="display:none;position:absolute;top:100%;left:0;right:0;background:#1e2f40;border:1px solid #3B8AC7;border-radius:0 0 8px 8px;max-height:200px;overflow-y:auto;z-index:50"></div>
          </div>
        </div>
        <div class="fi"><label>Referencia / Código *</label><input type="text" id="f-ref" placeholder="Ej: CAL-001"></div>
        <div class="fi"><label>Categoría *</label><select id="f-cat"></select></div>
        <div class="fi full"><label>Descripción *</label><input type="text" id="f-desc" placeholder="Descripción del artículo"></div>
        <div class="fi"><label>Cantidad en stock</label><input type="number" id="f-qty" placeholder="0" min="0"></div>
        <div class="fi"><label>Stock mínimo (alerta)</label><input type="number" id="f-min" placeholder="0" min="0"></div>
        <div class="fi"><label>Precio unitario (€)</label><input type="number" id="f-precio" placeholder="0.00" step="0.01" min="0"></div>
        <div class="fi"><label>Ubicación / Almacén</label><input type="text" id="f-ubic" placeholder="Ej: Estante A3"></div>
        <div class="fi full"><label>Proveedor</label><input type="text" id="f-prov" placeholder="Nombre del proveedor"></div>
      </div>
    </div>
    <div class="mft">
      <button class="btn bgr" onclick="closeModal()">Cancelar</button>
      <button class="btn bp" onclick="guardar()">💾 Guardar</button>
    </div>
  </div>
</div>

<!-- Modal ajuste cantidad -->

<div class="ov" id="ov-adj">
  <div class="modal msm">
    <div class="mhd">
      <div class="mtit">📊 Cantidad</div>
      <button class="mcls" onclick="closeAdj()">✕</button>
    </div>
    <div class="mbody" style="text-align:center">
      <div style="color:#5aa3d8;font-size:13px" id="adj-ref"></div>
      <div style="color:#e8f0f7;font-weight:600;font-size:14px;margin:4px 0 14px" id="adj-desc"></div>
      <div class="arow">
        <button class="abtn m" onclick="adjD(-1)">−</button>
        <div class="anum" id="adj-n">0</div>
        <button class="abtn p" onclick="adjD(1)">＋</button>
      </div>
      <div style="color:#5a7a94;font-size:12px">Mínimo: <span id="adj-min" style="color:#FDB913">—</span></div>
    </div>
    <div class="mft">
      <button class="btn bgr" onclick="closeAdj()">Cancelar</button>
      <button class="btn bp" onclick="saveAdj()">✔ Confirmar</button>
    </div>
  </div>
</div>

<!-- Modal categorías -->

<div class="ov" id="ov-cat">
  <div class="modal" style="max-width:460px">
    <div class="mhd">
      <div class="mtit">🏷️ Categorías</div>
      <button class="mcls" onclick="closeCatModal()">✕</button>
    </div>
    <div class="mbody">
      <div class="clist" id="catlist"></div>
      <div class="car">
        <input type="text" id="newcat" placeholder="Nueva categoría…" onkeydown="if(event.key==='Enter')addCat()">
        <button class="btn bp bsm" onclick="addCat()">＋ Añadir</button>
      </div>
    </div>
    <div class="mft"><button class="btn bp" onclick="closeCatModal()">Hecho</button></div>
  </div>
</div>

<div id="notif"></div>

<script>
// ── CONFIGURACIÓN ──
const SUPA_URL = 'https://sobiyfyzalynxcpfoldc.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNvYml5Znl6YWx5bnhjcGZvbGRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwMTA0MjksImV4cCI6MjA4ODU4NjQyOX0.FJOYHGjk-UI-SfEpZ2ytOvUJuTb4kGL9aBqj2ChXgek';
const TABLE = 'stock_materiales';
const CAT_KEY = 'haro_cats';
const DCATS = ['Calderas','Bombas de calor','Radiadores / Emisores','Suelo radiante','Tuberías y accesorios','Válvulas y llaves','Grupos hidráulicos','Depósitos y acumuladores','Eléctrico / Termostatos','Canaleta 7x5,5','Canaleta 9x6','Soporte pared aire','Herramientas','EPI / Seguridad','Varios'];

let items = [], sortCol = 'descripcion', sortDir = 1, editId = null, adjItem = null;

// ── CATEGORÍAS ──
function getCats() {
  try { const s = localStorage.getItem(CAT_KEY); return s ? JSON.parse(s) : [...DCATS]; } catch { return [...DCATS]; }
}
function saveCats(a) { localStorage.setItem(CAT_KEY, JSON.stringify(a)); }

// ── SUPABASE ──
async function supa(method, path, body) {
  const opts = {
    method,
    headers: {
      'apikey': SUPA_KEY,
      'Authorization': 'Bearer ' + SUPA_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation'
    }
  };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const r = await fetch(SUPA_URL + '/rest/v1/' + path, opts);
  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    throw new Error(e.message || ('HTTP ' + r.status + ' ' + r.statusText));
  }
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}

// ── CONEXIÓN ──
function setConn(ok) {
  const cd = document.getElementById('cd');
  const cl = document.getElementById('cl');
  if (cd) { cd.className = ok ? 'ok' : 'err'; }
  if (cl) { cl.textContent = ok ? 'Conectado' : 'Sin conexión'; }
}

// ── CARGA DE DATOS ──
async function loadItems() {
  const tb = document.getElementById('tbody');
  if (tb) tb.innerHTML = '<tr><td colspan="8"><div class="loading"><div class="spin"></div> Cargando…</div></td></tr>';
  try {
    // order por descripcion asc, ordenación cliente-side también disponible
    const d = await supa('GET', TABLE + '?select=*&order=descripcion.asc');
    items = d || [];
    setConn(true);
    render();
  } catch(e) {
    setConn(false);
    notify('Error cargando datos: ' + e.message, 'err');
    const tb2 = document.getElementById('tbody');
    if (tb2) {
      tb2.innerHTML = '<tr><td colspan="8"><div class="empty"><div class="eico">⚠️</div><p style="color:#e05252;font-size:13px;margin-top:8px">' + esc(e.message) + '</p><p style="color:#5a7a94;font-size:12px;margin-top:6px">Comprueba la política RLS de Supabase</p></div></td></tr>';
    }
  }
}

// ── RENDERIZADO ──
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const cat = document.getElementById('fcat').value;
  const alt = document.getElementById('falt').value;

  let list = items.filter(it => {
    const mq = !q || [it.referencia, it.descripcion, it.proveedor, it.categoria].some(v => (v || '').toLowerCase().includes(q));
    const mc = !cat || it.categoria === cat;
    let ma = true;
    if (alt === 'alerta') ma = it.cantidad > 0 && it.cantidad <= (it.stock_minimo || 0);
    if (alt === 'ok')     ma = it.cantidad > (it.stock_minimo || 0);
    if (alt === 'cero')   ma = it.cantidad === 0;
    return mq && mc && ma;
  });

  // Ordenación cliente-side (evita problemas con order clause de Supabase)
  list.sort((a, b) => {
    let va = a[sortCol] != null ? a[sortCol] : '';
    let vb = b[sortCol] != null ? b[sortCol] : '';
    if (typeof va === 'string') va = va.toLowerCase();
    if (typeof vb === 'string') vb = vb.toLowerCase();
    return va < vb ? -sortDir : va > vb ? sortDir : 0;
  });

  // KPIs
  document.getElementById('k1').textContent = items.length;
  const val = items.reduce((s, it) => s + (it.cantidad || 0) * (it.precio_unitario || 0), 0);
  document.getElementById('k2').textContent = val.toLocaleString('es-ES', {maximumFractionDigits: 0}) + '€';
  document.getElementById('k3').textContent = items.filter(it => it.cantidad > 0 && it.cantidad <= (it.stock_minimo || 0)).length;
  document.getElementById('k4').textContent = items.filter(it => it.cantidad === 0).length;
  document.getElementById('cnt').textContent = list.length + ' artículos';

  const tb = document.getElementById('tbody');
  if (!list.length) {
    tb.innerHTML = '<tr><td colspan="8"><div class="empty"><div class="eico">📭</div>No hay artículos</div></td></tr>';
    return;
  }

  // Usar bucle for clásico (compatibilidad iPad/Safari)
  var h = '';
  for (var i = 0; i < list.length; i++) {
    var it = list[i];
    var min = it.stock_minimo || 0;
    var qty = it.cantidad || 0;
    var pct = min > 0 ? Math.min(100, Math.round(qty / min * 100)) : 100;
    var lv = qty === 0 ? 'danger' : qty <= min ? 'warn' : 'ok';
    var ab = qty === 0 ? '<span class="alb">Sin stock</span>' : qty <= min ? '<span class="alb">Stock bajo</span>' : '';
    var precio = it.precio_unitario != null ? Number(it.precio_unitario).toFixed(2) + '€' : '—';
    h += '<tr>';
    h += '<td class="tref">' + esc(it.referencia || '—') + '</td>';
    h += '<td class="tdesc">' + esc(it.descripcion || '—') + '</td>';
    h += '<td><span class="cb">' + esc(it.categoria || '—') + '</span></td>';
    h += '<td><div class="qw"><span class="qn ' + lv + '">' + qty + '</span><div class="sb"><div class="sf ' + lv + '" style="width:' + pct + '%"></div></div>' + ab + '</div></td>';
    h += '<td>' + esc(it.ubicacion || '—') + '</td>';
    h += '<td class="tprc">' + precio + '</td>';
    h += '<td>' + esc(it.proveedor || '—') + '</td>';
    h += '<td><div class="aw"><button class="btn bsm be" onclick="openAdj(' + it.id + ')" title="Ajustar">±</button><button class="btn bsm be" onclick="openEdit(' + it.id + ')" title="Editar">✏️</button><button class="btn bsm bd" onclick="eliminar(' + it.id + ')" title="Eliminar">🗑️</button></div></td>';
    h += '</tr>';
  }
  tb.innerHTML = h;
}

// ── CATEGORÍAS EN SELECTORES ──
function buildCats() {
  const cats = getCats();
  const fcat = document.getElementById('fcat');
  const fCatModal = document.getElementById('f-cat');
  if (fcat) fcat.innerHTML = '<option value="">Todas las categorías</option>' + cats.map(function(c){ return '<option value="' + esc(c) + '">' + esc(c) + '</option>'; }).join('');
  if (fCatModal) fCatModal.innerHTML = cats.map(function(c){ return '<option value="' + esc(c) + '">' + esc(c) + '</option>'; }).join('');
}

// ── MODAL ARTÍCULO ──
function openModal(id) {
  editId = id || null;
  buildCats();
  if (id) {
    const it = items.find(function(x){ return x.id === id; });
    document.getElementById('m-ico').textContent = '✏️';
    document.getElementById('m-tit').textContent = 'Editar artículo';
    document.getElementById('f-ref').value   = it.referencia || '';
    document.getElementById('f-desc').value  = it.descripcion || '';
    document.getElementById('f-cat').value   = it.categoria || '';
    document.getElementById('f-qty').value   = it.cantidad != null ? it.cantidad : '';
    document.getElementById('f-min').value   = it.stock_minimo != null ? it.stock_minimo : '';
    document.getElementById('f-precio').value = it.precio_unitario != null ? it.precio_unitario : '';
    document.getElementById('f-ubic').value  = it.ubicacion || '';
    document.getElementById('f-prov').value  = it.proveedor || '';
  } else {
    document.getElementById('m-ico').textContent = '＋';
    document.getElementById('m-tit').textContent = 'Nuevo artículo';
    ['f-ref','f-desc','f-qty','f-min','f-precio','f-ubic','f-prov'].forEach(function(x){ document.getElementById(x).value = ''; });
    document.getElementById('cat-search').value = '';
    document.getElementById('cat-results').style.display = 'none';
  }
  document.getElementById('ov-art').classList.add('open');
}
function openEdit(id) { openModal(id); }
function closeModal() { document.getElementById('ov-art').classList.remove('open'); }

async function guardar() {
  const ref  = document.getElementById('f-ref').value.trim();
  const desc = document.getElementById('f-desc').value.trim();
  if (!ref || !desc) { notify('Referencia y descripción obligatorias', 'err'); return; }
  const body = {
    referencia:     ref,
    descripcion:    desc,
    categoria:      document.getElementById('f-cat').value,
    cantidad:       parseInt(document.getElementById('f-qty').value) || 0,
    stock_minimo:   parseInt(document.getElementById('f-min').value) || 0,
    precio_unitario: parseFloat(document.getElementById('f-precio').value) || null,
    ubicacion:      document.getElementById('f-ubic').value.trim() || null,
    proveedor:      document.getElementById('f-prov').value.trim() || null
  };
  try {
    if (editId) {
      await supa('PATCH', TABLE + '?id=eq.' + editId, body);
      notify('Actualizado ✔', 'ok');
    } else {
      await supa('POST', TABLE, body);
      notify('Añadido ✔', 'ok');
    }
    closeModal();
    await loadItems();
  } catch(e) { notify('Error: ' + e.message, 'err'); }
}

async function eliminar(id) {
  const it = items.find(function(x){ return x.id === id; });
  if (!confirm('¿Eliminar "' + (it ? it.descripcion : '') + '"?')) return;
  try {
    await supa('DELETE', TABLE + '?id=eq.' + id);
    notify('Eliminado', 'info');
    await loadItems();
  } catch(e) { notify('Error: ' + e.message, 'err'); }
}

// ── MODAL AJUSTE CANTIDAD ──
function openAdj(id) {
  adjItem = items.find(function(x){ return x.id === id; });
  if (!adjItem) return;
  document.getElementById('adj-ref').textContent  = adjItem.referencia || '';
  document.getElementById('adj-desc').textContent = adjItem.descripcion || '';
  document.getElementById('adj-n').textContent    = adjItem.cantidad || 0;
  document.getElementById('adj-n').style.color = '#e8f0f7';
  document.getElementById('adj-n').style.webkitTextFillColor = '#e8f0f7';
  document.getElementById('adj-min').textContent  = adjItem.stock_minimo || 0;
  document.getElementById('ov-adj').classList.add('open');
}
function adjD(d) {
  const el  = document.getElementById('adj-n');
  const v   = Math.max(0, parseInt(el.textContent) + d);
  const min = adjItem ? (adjItem.stock_minimo || 0) : 0;
  el.textContent = v;
  const c = v === 0 ? '#e05252' : v <= min ? '#FDB913' : '#5A9F3E';
  el.style.color = c;
  el.style.webkitTextFillColor = c;
}
function closeAdj() { document.getElementById('ov-adj').classList.remove('open'); adjItem = null; }
async function saveAdj() {
  const qty = parseInt(document.getElementById('adj-n').textContent);
  try {
    await supa('PATCH', TABLE + '?id=eq.' + adjItem.id, {cantidad: qty});
    notify('Actualizado ✔', 'ok');
    closeAdj();
    await loadItems();
  } catch(e) { notify('Error: ' + e.message, 'err'); }
}

// ── MODAL CATEGORÍAS ──
function openCatModal() {
  const cats = getCats();
  document.getElementById('catlist').innerHTML = cats.map(function(c, i){
    return '<div class="ctag">' + esc(c) + '<span class="cx" onclick="delCat(' + i + ')">✕</span></div>';
  }).join('');
  document.getElementById('ov-cat').classList.add('open');
}
function closeCatModal() { document.getElementById('ov-cat').classList.remove('open'); buildCats(); render(); }
function addCat() {
  const inp = document.getElementById('newcat');
  const v = inp.value.trim();
  if (!v) return;
  const cats = getCats();
  if (cats.includes(v)) { notify('Ya existe', 'err'); return; }
  cats.push(v);
  saveCats(cats);
  inp.value = '';
  openCatModal();
  notify('Categoría añadida ✔', 'ok');
}
function delCat(i) { const cats = getCats(); cats.splice(i, 1); saveCats(cats); openCatModal(); }

// ── ORDENACIÓN ──
function srt(col) { if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = 1; } render(); }

// ── NOTIFICACIONES ──
function notify(msg, type) {
  const d = document.createElement('div');
  d.className = 'ntf ' + type;
  d.innerHTML = '<span>' + (type === 'ok' ? '✔' : type === 'err' ? '✖' : 'ℹ') + '</span><span>' + msg + '</span>';
  document.getElementById('notif').appendChild(d);
  setTimeout(function(){ if (d.parentNode) d.parentNode.removeChild(d); }, 3200);
}

// ── CATÁLOGO ──
var catalogData = [];
async function loadCatalog() {
  try {
    catalogData = await supa('GET', 'articulos?select=id,referencia,descripcion,categoria,proveedor&order=descripcion.asc');
    if (!catalogData) catalogData = [];
  } catch(e) { catalogData = []; }
}
function searchCatalog() {
  const q = document.getElementById('cat-search').value.trim().toLowerCase();
  const res = document.getElementById('cat-results');
  if (q.length < 2) { res.style.display = 'none'; return; }
  var matches = [];
  for (var i = 0; i < catalogData.length && matches.length < 10; i++) {
    var a = catalogData[i];
    if ((a.descripcion || '').toLowerCase().includes(q) || (a.referencia || '').toLowerCase().includes(q)) {
      matches.push(a);
    }
  }
  if (!matches.length) { res.style.display = 'none'; return; }
  var html = '';
  for (var j = 0; j < matches.length; j++) {
    var m = matches[j];
    html += '<div onclick="selectFromCatalog(' + m.id + ')" style="padding:9px 12px;cursor:pointer;border-bottom:1px solid #2d4a62;font-size:13px;color:#e8f0f7;transition:background .15s" onmouseover="this.style.background=\'#243647\'" onmouseout="this.style.background=\'\'">';
    html += '<div style="font-weight:600">' + esc(m.descripcion || '—') + '</div>';
    html += '<div style="font-size:11px;color:#5a7a94">' + esc(m.referencia || '') + (m.proveedor ? ' · ' + esc(m.proveedor) : '') + '</div>';
    html += '</div>';
  }
  res.innerHTML = html;
  res.style.display = 'block';
}
function selectFromCatalog(id) {
  var a = null;
  for (var i = 0; i < catalogData.length; i++) { if (catalogData[i].id === id) { a = catalogData[i]; break; } }
  if (!a) return;
  document.getElementById('f-ref').value  = a.referencia || '';
  document.getElementById('f-desc').value = a.descripcion || '';
  document.getElementById('f-prov').value = a.proveedor || '';
  var cat = mapStockCat(a.categoria);
  var sel = document.getElementById('f-cat');
  for (var i = 0; i < sel.options.length; i++) {
    if (sel.options[i].value === cat) { sel.selectedIndex = i; break; }
  }
  document.getElementById('cat-search').value = a.descripcion || '';
  document.getElementById('cat-results').style.display = 'none';
}
function mapStockCat(cat) {
  if (!cat) return 'Varios';
  var c = cat.toLowerCase();
  if (c.includes('caldera') || c.includes('calefac') || c.includes('radiador')) return 'Calderas';
  if (c.includes('bomba') || c.includes('calor')) return 'Bombas de calor';
  if (c.includes('suelo')) return 'Suelo radiante';
  if (c.includes('tuber') || c.includes('tubo')) return 'Tuberías y accesorios';
  if (c.includes('válvula') || c.includes('valvula')) return 'Válvulas y llaves';
  if (c.includes('depós') || c.includes('acumul')) return 'Depósitos y acumuladores';
  if (c.includes('electr') || c.includes('termostato')) return 'Eléctrico / Termostatos';
  if (c.includes('canaleta')) return c.includes('7') ? 'Canaleta 7x5,5' : 'Canaleta 9x6';
  if (c.includes('soporte') || c.includes('aire')) return 'Soporte pared aire';
  if (c.includes('herram')) return 'Herramientas';
  if (c.includes('epi') || c.includes('segur')) return 'EPI / Seguridad';
  return 'Varios';
}
document.addEventListener('click', function(e) {
  if (!e.target.closest('#cat-search-wrap')) {
    var r = document.getElementById('cat-results');
    if (r) r.style.display = 'none';
  }
});

// ── INICIO — sin scripts de redirect ni cache-busting ──
document.addEventListener('DOMContentLoaded', function() {
  buildCats();
  loadItems();
  loadCatalog();
  document.getElementById('srch').addEventListener('input', render);
  document.getElementById('fcat').addEventListener('change', render);
  document.getElementById('falt').addEventListener('change', render);
});
</script>

</body>
</html>
